    <script>
      var GREEK_POOL = [
        { era: '爱琴文明：米诺斯与迈锡尼', time: '约公元前2000—前1100年 · 青铜时代',
          text: '希腊文明的黎明要追溯到爱琴海地区的青铜文明。最先崛起的是克里特岛上的米诺斯文明（约前2000—前1450）：它因英国考古学家伊文思发掘克诺索斯王宫而得名——多层楼阁、上下水道、色彩鲜艳的海豚与跳牛壁画，展现出高度发达的宫廷文明。米诺斯人创造了欧洲最早的文字“线形文字A”（至今未被释读），凭借强大的海军控制爱琴海航路，与埃及、叙利亚广泛贸易，堪称“第一个海上霸权”。修昔底德甚至写道，米诺斯王是希腊人所知的第一支海军的建立者。希腊神话中牛头怪米诺陶洛斯的迷宫传说，正是这段历史留在记忆里的回声。\n这段文明的“再发现”本身就是传奇。1870 年代，德国商人谢里曼坚信《荷马史诗》绝非虚构，带着史诗到土耳其的希萨里克丘发掘，真的挖出了特洛伊城址与大批黄金首饰，轰动世界；接着他又循史诗线索，在伯罗奔尼撒的迈锡尼掘开竖井王墓，拍电报给希腊国王说：“我已凝视着阿伽门农的脸。”1900 年，伊文思买下克里特的山丘，挖出了传说中的克诺索斯“迷宫”。几个“业余爱好者”用一把铲子，把希腊史从文学重新拉回了大地。\n约前1450年前后，克里特岛上的各王宫相继被毁，控制权转移到希腊本土的迈锡尼人手中。迈锡尼文明（约前1600—前1100）的创造者是南下的印欧语系希腊人：狮子门、蜂窝状圆顶王墓与黄金面罩展示其武力和财富。更重要的是，迈锡尼人使用的“线形文字B”于1952年被青年建筑师文特里斯成功释读——它是最早的希腊语书面文字，泥板内容多为王宫的物资清单与徭役记录，证明迈锡尼正是荷马史诗里远征特洛伊的那个希腊世界的历史原型。\n史诗里的特洛伊战争也有历史影子：约前1250年前后，以迈锡尼为首的希腊联军渡海围攻小亚细亚的特洛伊，相传为夺回斯巴达王后海伦而十年苦战，最终以“木马计”破城。考古学家在特洛伊遗址发现了这一时期城市被猛烈焚毁的地层——战争确有其事，只是规模与起因未必如史诗渲染得那样浪漫。\n约前1200年起，“海上民族”的迁徙浪潮席卷东地中海，迈锡尼各王宫相继毁于战火，爱琴文明全面崩溃：城市废弃、文字失传、贸易中断，希腊倒退回没有城市与文字的乡村社会。历史由此进入文明断层期——但它留下的史诗记忆、宗教观念和社会组织雏形，将成为下一个时代的种子。',
          quiz: '线形文字B 的成功释读为什么被视为考古学与史学上的重大突破？',
          answer: '第一，它证明线形文字B 记录的是最早的希腊语，从而确认迈锡尼文明的主人是希腊人的祖先，把希腊文明史从古风时代上溯到了青铜时代整整一千年。第二，释读出的泥板多为王宫仓储、贡赋、徭役清单，让学界第一次直接读到迈锡尼“宫廷再分配经济”的运作方式，而不是仅靠荷马史诗的传说和墓葬推断。第三，它划清了米诺斯（线形文字A，非希腊语）与迈锡尼两个文明的界限，为爱琴考古建立了科学坐标。' },
        { era: '黑暗时代（荷马时代）', time: '约公元前1100—前800年 · 文明断层与史诗记忆',
          text: '迈锡尼崩溃后的两百多年，传统上被称为“黑暗时代”：文字知识随宫室书吏一同消失，城市建设、海外贸易、精美工艺全面衰退，人口锐减。皮罗斯王宫的泥板上还留着仓促备战的最后记录，几天后王宫就在大火中化为焦土——文明崩塌之突然，可见一斑。但黑暗中孕育着新的可能：铁器逐渐普及，价格便宜的铁制农具与兵器取代青铜，为下一次复兴提供了技术基础。\n社会结构上，迈锡尼的“王—宫廷”体制解体，取而代之的是以氏族为基础的村落共同体：公共事务由贵族议事会商议，再交给全体自由民组成的公民大会喝彩通过——这种“军事民主制”正是后来城邦政治的胚胎。希腊人也在爱琴海两岸迁徙：爱奥尼亚人渡海定居小亚细亚西岸（米利都、以弗所十餘城），多利安人进入伯罗奔尼撒南部与克里特，奠定了古风时代希腊世界的族群地理格局。\n这个时代最重要的文化成就，是行吟诗人口耳相传的荷马史诗。想象这样的场景：贵族的宴会上，篝火旁的吟游诗人抱着四弦琴，为满座宾客吟唱阿喀琉斯的愤怒与奥德修斯的漂泊——没有文字，几千行诗全凭程式化的韵律记忆，一代代口耳相传，直到前 8 世纪才被写定。《伊利亚特》与《奥德赛》追述的虽是特洛伊战争的英雄时代，保存的却是黑暗时代的社会记忆与价值观念——贵族的荣誉、好客的义务、对诸神的敬畏。同时代还有另一副嗓子：波奥提亚农夫诗人赫西俄德的《工作与时日》，第一次替平民控诉贵族判案不公——“野兽、鱼类互相吞食，而人却得到了公正，这公正最好的守护者就是法律”。黑暗时代的希腊没有文字，史诗就是它的全部历史与教科书。',
          quiz: '为什么说荷马史诗是研究黑暗时代希腊社会的核心材料？使用它时又需要注意什么局限？',
          answer: '核心材料的原因：黑暗时代文字失传、考古遗存稀少，荷马史诗是唯一连续反映该时代及稍前社会的“文献”，其中保存了军事民主制、贵族与平民关系、宗教观念、好客制度等大量真实的社会史信息，考古发现的几何陶纹样甚至与史诗描述的盾牌形制互相印证。局限在于：史诗最终定形于古风时代早期，内容混合了迈锡尼记忆与后世的物质细节（如混合使用铁器与青铜、火葬与埋葬并存），它描绘的是“英雄时代的理想图景”而非某一具体年代的真实社会；因此使用时必须与考古材料互相校核，把史诗当作价值观的镜子而非编年史料。' },
        { era: '古风时代：城邦、大殖民与制度创新', time: '约公元前800—前480年 · 城邦世界的形成',
          text: '约前 800 年起，希腊迎来全面复兴，进入“古风时代”。这个时代最根本的成就，是城邦（polis）在希腊各地普遍形成：以城市为中心、连同周边乡村组成的主权公民共同体，规模小（雅典这种大城邦也不过数十万人）、实行自治、公民直接参与公共事务。“小国寡民”的城邦体制将成为此后希腊一切政治实验的舞台。\n人口增长与土地匮乏引发了波澜壮阔的大殖民运动（前8—前6世纪）：希腊人向西到达西西里、南意大利（被称为“大希腊”）和马赛，向北到拜占庭（今伊斯坦布尔的前身），向南到北非的昔兰尼与埃及的瑙克拉提斯，向东遍布黑海沿岸。殖民城邦与母邦平等而非隶属，但把希腊的商贸、字母与生活方式带遍了地中海，使希腊从爱琴海走向“整个地中海的希腊”。\n这一时期许多工商业发达的城邦经历了僭主政治：以非法手段攫取权力的个人统治。科林斯的库普塞鲁斯推翻氏族贵族建立了父子两代僭主统治；雅典的庇西特拉图三次夺权的故事最为跌宕——他先装作被政敌打伤混入公民大会求得卫队，被逐后流亡十年积蓄雇佣兵卷土重来，最终稳坐江山十九年。僭主们标榜平民、打击氏族世家，客观上削弱了贵族、推动了工商业与公共建设，多数僭主政权最终被民主政治取代。同时，两大城邦走出了两种典型的制度道路：斯巴达经来库古改革形成双王、长老会议与公民大会混合的政体，全民军事化以统治数倍于己的黑劳士；雅典的道路则曲折得多——前 621 年德拉古立法严酷到“用血写成”；前 594 年梭伦受命调停贵族与平民的内战边缘，宣布“解负令”废除债务奴隶、按财产把公民分四级、设四百人会议，随后自我放逐十年，把一整套中庸改革留给雅典消化；庇西特拉图之后，克利斯提尼改革（前508：以地域部落取代血缘部落、设五百人会议、首创陶片放逐法）让民主政治的基础最终奠定。\n文化上，古风时代完成了希腊字母的创造（约前8世纪，在腓尼基字母基础上加入元音），文字重临使荷马、赫西俄德的史诗得以写定；前 776 年第一届奥林匹克运动会举行——为宙斯献祭竞技，赛会期间各邦休战（“神圣休战”），此后每四年一届，成为希腊纪年的起点；公元前 6 世纪，小亚米利都城出现了第一批自然哲学家——泰勒斯预言日食、追问“万物本原是水”，开始用自然的原因而非神话解释世界。这一切，都在为下一个世纪的辉煌积蓄力量。',
          quiz: '请总结古风时代的历史特征，并展开详述。',
          answer: '古风时代的历史特征可概括为五个方面：其一，城邦制度普遍形成。氏族社会解体后，希腊各地形成了以城市为中心的公民共同体——城邦，它小国寡民、主权在公民集体，从此成为希腊政治生活的基本单元。其二，大殖民运动蓬勃展开。因人口增长与土地不足，前8—前6世纪希腊人向地中海和黑海沿岸广泛殖民，建立起数十个与母邦平等的新城邦，既缓和了社会矛盾，又把希腊文明扩散到整个地中海世界，促进了商业网络与文化交融。其三，僭主政治在许多工商业发达的城邦盛行。僭主虽是非法夺权，却普遍打击氏族贵族、扶持工商业、大兴公共工程，客观上为民主政治的诞生扫清了道路。其四，出现了两种典型的制度创新。斯巴达通过来库古改革建立了全民军事化的贵族政体以统治黑劳士；雅典则经德拉古立法、梭伦改革、克利斯提尼改革三步，确立了地域部落制、五百人会议与陶片放逐法，奠定民主政治的基础。其五，文化实现奠基性复兴：改造腓尼基字母创制希腊字母、荷马与赫西俄德史诗写定、前776年首届奥林匹克运动会举行、米利都自然哲学兴起，希腊人从此开始用理性解释世界。这五个特征共同构成古风时代“承黑暗时代之困、开古典时代之盛”的历史地位。' },
        { era: '希波战争：以弱胜强的生死之战', time: '公元前492—前449年 · 希腊世界的保卫战',
          text: '古风时代晚期，波斯帝国的扩张与小亚希腊城邦的矛盾终于引爆：前 499 年，以米利都为首的爱奥尼亚城邦起义，向希腊本土求援，只有雅典和埃雷特里亚派出二十艘战舰支援。波斯镇压起义后，以此为借口两度远征希腊——希波战争爆发。\n前 490 年，波斯军队在雅典东北的马拉松平原登陆。雅典以一万重装步兵迎战数倍于己的敌军，统帅米太亚得故意加固中央、集中精锐加强两翼：中央佯退诱敌追击，两翼合围屠杀——波斯军阵被拦腰斩断，溃逃回船。阵亡的一百九十二名雅典人被葬于战场，而波斯损失逾六千。传说士兵菲迪皮德斯飞奔四十公里回雅典报捷，喊出“我们胜利了”便力竭而亡——今天的马拉松长跑即由此而来。此时斯巴达因宗教节期（月圆祭典）未能驰援。\n十年后，波斯王薛西斯率数十万大军、千余战舰水陆并进卷土重来。希腊联军在温泉关迎击：斯巴达王李奥尼达率三百勇士与数千盟军死守隘口三天，波斯人劝降交出武器，他回答“来拿吧！”；因叛徒引小路包抄，李奥尼达战死，墓志铭由西蒙尼德写成：“过客啊，请带话给斯巴达人：我们遵从他们的命令，长眠于此。”温泉关失守后雅典弃城，地米斯托克利把全体居民撤到舰上，并在萨拉米斯湾巧施假情报诱骗薛西斯下令舰队封锁海湾出口——狭窄水面使波斯大舰施展不开，雅典灵活的三列桨战舰大破敌军。薛西斯眼看败局，留军北逃。前 479 年，希腊联军又在普拉提亚和米卡勒海角取得陆海双胜，战争主动权彻底易手。\n前 478 年，爱琴海沿岸城邦组成以雅典为首的提洛同盟，持续反攻，战火渐向东移。前 449 年双方订立《卡里阿斯和约》，波斯承认小亚希腊城邦独立，希波战争正式结束。这场战争的意义远超军事：希腊诸邦以远弱于波斯的力量保卫了独立，保存并放大了城邦制度与古典文化的生命力；雅典则因海上战功一跃成为希腊最强大的城邦——这份战功，不久将转化为帝国，也为下一场大战埋下种子。',
          quiz: '希波战争中希腊以弱胜强的关键因素有哪些？',
          answer: '其一，战争性质使然：希腊诸邦是为独立而战，士气与凝聚力远强于由多民族强征拼凑、士气低落的波斯大军。其二，重装步兵与海军的战术优势：希腊重装方阵在陆地近战中占优，雅典的三列桨战舰则在狭窄海峡的机动战中发挥极致（萨拉米斯）。其三，地利：温泉关、萨拉米斯海峡、普拉提亚山地都限制了大军的展开。其四，领袖的正确决策：地米斯托克利放弃雅典城、诱敌海战的战略眼光，是扭转战局的关键。其五，希腊诸邦在生死关头实现了空前的联合（斯巴达任陆军统帅、雅典任海军统帅），尽管内部矛盾不断，协作战仍是胜利的组织基础。' },
        { era: '雅典帝国与伯里克利时代', time: '公元前478—前429年 · 民主的完成与黄金时代',
          text: '希波战争还未结束，雅典就已组建了提洛同盟：爱琴海沿岸和小亚城邦出资出舰，共同对波斯作战。同盟金库原本设在提洛岛，前 454 年被雅典以安全为由移到雅典；同盟变成了“雅典帝国”——盟邦变为纳贡的属国，退盟即遭镇压（纳克索斯、萨索斯）。帝国的贡金养活了雅典的海军、民主与伟大的建筑工程。\n内政上，雅典民主在前 5 世纪中叶最终完成。埃菲阿尔特改革剥除了贵族议事会（战神山议事会）的大部分权力；伯里克利连任首席将军十余年，确立公民大会为最高权力机关、五百人会议轮值执政、陪审法庭向公民发放津贴、几乎所有公职向公民开放并抽签产生，甚至发放“观剧津贴”让穷人也能参加文化生活。雅典民主在其时达到了古代世界前所未有的高度——尽管它的基石仍是数万名奴隶的劳动，妇女和外邦人始终被排除在公民之外。\n伯里克利时代也是古典文化的黄金时代。他的葬礼演说最能代表这个时代的自信：阵亡将士国葬典礼上，他对全城公民宣告——“我们的政体之所以被称为民主政体，是因为政权在全体公民手中，而不在少数人手中……我们的城市是全希腊的学校。”前 447 年动工的帕特农神庙历时十五年落成：建筑师伊克蒂诺斯与卡利克拉特设计，雕刻大师菲狄亚斯主持全部工程，神庙内高达十二米的雅典娜黄金象牙像与它精妙的视觉修正曲线，至今被建筑史奉为不可逾越的典范。悲剧舞台同样群星璀璨：埃斯库罗斯、索福克勒斯、欧里庇得斯与喜剧家阿里斯托芬每年在酒神剧场竞演；史学家希罗多德的《历史》也在这座城市完成。而站在这一切顶端的伯里克利，身边站着来自米利都的才女阿斯帕西娅——她的智慧连苏格拉底都是常客。\n但帝国的扩张也不断积累着盟邦的怨恨与斯巴达的恐惧：贡金变成了雅典的办公楼与神庙，盟邦的内政被干涉，异议者被流放。黄金时代的裂缝已在暗中生长。',
          quiz: '提洛同盟是怎样一步步演变为“雅典帝国”的？这一演变说明了什么？',
          answer: '演变过程：提洛同盟（前478）最初是平等城邦的攻守同盟，盟邦可出舰或纳贡；前470年前后雅典镇压要求退盟的纳克索斯岛、前465年镇压萨索斯起义，退盟权事实上被剥夺；前454年同盟金库迁往雅典，贡金被用于雅典自己的城市建设工程与海军；此后雅典开始向盟邦派驻监察官与驻军、推行雅典式民主、强令使用雅典货币与度量衡，并要求盟邦案件送雅典陪审法庭审理——同盟彻底变为听命于雅典的帝国。这说明：其一，霸权国家主导的同盟极易从“安全共同体”异化为控制工具；其二，帝国的资源反哺了雅典的民主与文化，使制度成就与霸权逻辑缠绕共生；其三，压迫盟邦积怨日深，最终在伯罗奔尼撒战争中成为雅典失败的重要原因。' },
        { era: '古典文化的巅峰：哲学、史学与艺术', time: '公元前5世纪 · 理性的觉醒',
          text: '希波战争后的雅典，聚集了全希腊的智者与艺术家，古典文化在战火与民主的交织中达到巅峰。哲学的脉络清晰可见：先是米利都学派与赫拉克利特、德谟克利特（原子论）等自然哲学家追问世界的本原；随后智者运动把目光转向人与社会，普罗塔哥拉喊出“人是万物的尺度”。苏格拉底则扭转方向，终生赤脚在雅典街头追问“什么是正义、什么是美德”，以反诘法启发思考。前 399 年，雅典以“不敬城邦之神、败坏青年”两项罪名判处他死刑——五百零一名陪审员仅以微弱多数定罪。狱中他拒绝朋友安排的越狱：“一个人应当遵守他与城邦的法律之约。”行刑那天，他从容与弟子讨论灵魂不朽，然后接过毒堇汁，仰面饮尽——柏拉图在《斐多篇》里记录了这最后的时刻。他的弟子柏拉图创办学园（前387，因校址在阿卡德摩斯园林得名，延续九百余年）、著《理想国》、提出理念论；柏拉图的学生亚里士多德创办吕克昂学园，著述涵盖逻辑、伦理、政治、生物、诗学，堪称古代世界的百科全书，他还有另一个身份——亚历山大大帝的老师。\n史学在这一时期正式诞生。希罗多德的《历史》以希波战争为主线，记录了希腊与波斯世界的风土人情，被尊为“史学之父”；修昔底德本是雅典将军，因驰援安菲波利斯不及时被放逐，二十年流亡中随军记录战争，写下《伯罗奔尼撒战争史》，提出“使战争无可避免的真正原因，是雅典力量的增长引起了斯巴达的恐惧”——这一“修昔底德陷阱”的论断至今仍是国际关系的经典命题。\n艺术与科学同样辉煌：悲剧在埃斯库罗斯、索福克勒斯、欧里庇得斯笔下从祭祀歌舞发展为深刻的人性剧场（《俄狄浦斯王》为代表），阿里斯托芬的喜剧辛辣地讽刺时政；医学上希波克拉底开创了以观察和伦理为本的理性医学传统，誓言流传至今。这一切成就的共同底色，是城邦的公共生活——剧场、法庭、市集与公民辩论，构成了希腊理性生长的土壤。',
          quiz: '苏格拉底、柏拉图、亚里士多德师徒三人各自的核心贡献是什么？他们的思想如何构成一条延续的线索？',
          answer: '苏格拉底把哲学从天上带回人间：他不再追问自然本原，而是追问人的德性与善恶，以“反诘法”（问答中不断暴露对方定义的矛盾）逼人审视自己的信念，提出“未经审视的人生不值得过”——他为哲学确立了“理性自省”的方法。柏拉图继承老师的追问并给出体系化答案：可感世界背后存在永恒不变的“理念世界”，人的认识是灵魂对理念的回忆，政治理想则凝结在《理想国》的“哲学王”设计中，并创办西方第一所学园。亚里士多德名句“吾爱吾师，吾更爱真理”正是对柏拉图理念的批判性修正：他拒绝脱离具体事物的抽象理念，主张从经验观察出发研究万物，建立了逻辑学（三段论）与分科研究的体系，将伦理学落脚于“幸福是合乎德性的实现活动”。三人一线：从自省，到体系，再到经验与逻辑——构成西方理性传统的第一座完整金字塔。' },
        { era: '伯罗奔尼撒战争：黄金时代的自毁', time: '公元前431—前404年 · 二十七年的内战',
          text: '雅典帝国的扩张终于触动了斯巴达为首的伯罗奔尼撒同盟。前 431 年，战争全面爆发。修昔底德一针见血地指出深层原因：“使战争无可避免的真正原因，是雅典力量的增长，以及由此引起的斯巴达人的恐惧。”这场希腊人打希腊人的内战，持续了整整二十七年。\n战争第一阶段（前431—前421，史称阿基达马斯战争）：斯巴达陆军年年焚掠阿提卡农村，雅典凭借连接雅典城与比雷埃夫斯港的“长城”据守、以海军袭扰伯罗奔尼撒沿岸；前 430 年大瘟疫席卷雅典——修昔底德亲身患病记录：健康的人突然头部发烧、眼睛红肿、咽喉溃烂，第七八天死亡便从腹部蔓延而下，医生束手无策且死者以医生为最多；全城道德崩坏，人人在绝望中及时行乐。人口锐减四分之一，主导战争的伯里克利也病死其中，临终前雅典人已先罚了他一笔款。双方打得筋疲力尽，前 421 年订立《尼西亚斯和约》，但和约形同虚设，冲突并未真正停止。\n和约后的关键人物是光彩夺目又反复无常的亚西比德：前 415 年他鼓动雅典倾国之兵远征西西里的叙拉古；出征前夜，全城的神像面孔却被人捣毁，他被控亵渎神明，中途被召回受审——索性叛逃斯巴达，并给宿敌献上破敌之策：派兵驰援叙拉古、在阿提卡永久设垒。远征以惨败告终：夜袭失利后，撤退又因月食延误，叙拉古大港海战雅典舰队被堵在港内全歼，数万陆军在向内陆撤退的路上被杀被俘，战俘被扔进叙拉古采石场，瘟疫与苦役下幸存者寥寥。斯巴达则用波斯的金钱重建了舰队。前 405 年羊河海战，莱山德趁雅典舰队上岸散漫之机突然袭击，一百七十余艘战舰被俘获，三千名雅典俘虏被处决。次年被封锁的雅典投降：拆毁长城、交出全部舰队（只留十二艘警戒船）、解散提洛同盟、接受“三十僭主”统治。雅典帝国灰飞烟灭，希腊的黄金时代就此终结。这场战争留下的教训被修昔底德写进史书：内耗的代价，永远大于胜利的荣光。',
          quiz: '伯罗奔尼撒战争的深层原因是什么？它给希腊世界带来了怎样的后果？',
          answer: '深层原因：修昔底德的经典论断——“使战争无可避免的真正原因，是雅典力量的增长引起了斯巴达的恐惧”，即新兴强权与既有霸权之间的结构性冲突（后世称之为“修昔底德陷阱”）。直接诱因则是科基拉与科林斯的冲突、以及雅典对米加拉的禁令等系列事件。后果：雅典战败、帝国解体、民主中断（三十僭主）；但更深远的是对整个希腊世界的伤害——各邦在战争中两败俱伤、雇佣兵盛行、公民道德滑坡，城邦政治的凝聚力从此一蹶不振；战后斯巴达的专横统治又迅速激起各邦新的反抗，希腊进入霸权频繁更迭却无人能稳定的城邦危机时代。' },
        { era: '城邦危机与底比斯的短暂崛起', time: '公元前4世纪上半叶 · 无人能主宰的希腊',
          text: '伯罗奔尼撒战争后，斯巴达凭借胜利成为希腊霸主，却迅速走向专横：它强行在各邦扶植亲斯巴达的寡头政权（如雅典的“三十僭主”——他们三个月内就处决了约一千五百名公民，比十年战争死的人还多），干涉内政、索要贡赋。前 395 年，底比斯、雅典、科林斯、阿尔戈斯结成同盟对斯巴达开战（科林斯战争），战争打到前 387 年，波斯以“大王和约”强行仲裁——所有城邦自治、塞浦路斯等地归波斯。曾经并肩抗波斯的希腊，如今要靠波斯敕令来维持和平，城邦自主的神话开始破灭。\n真正给斯巴达霸权致命一击的是底比斯。这个玻俄提亚的城邦在伊巴密浓达和佩洛皮达斯领导下革新军事：著名的“斜线战斗队形”一反传统平齐战线，把五十年不下五十对的精锐“神圣战队”集中在左翼，形成重锤猛砸敌军右翼要害。前 371 年留克特拉之战，伊巴密浓达以斜线阵大破号称不可战胜的斯巴达方阵，斯巴达王克莱翁布罗图斯战死——这是斯巴达陆军数百年来的第一次决定性惨败。战后伊巴密浓达挥师伯罗奔尼撒，解放了美塞尼亚的黑劳士（他们独立建城，斯巴达的经济与兵源根基从此崩塌），昔日被奴役的阿卡迪亚人也纷纷建城自立。底比斯称雄十年，但前 362 年曼丁尼亚之战，伊巴密浓达率军再度粉碎斯巴达与雅典联军，自己却在冲锋时被长矛刺中。传说弥留之际他问：“我是否还活着？”得知底比斯已胜，他微笑答道：“那么我死得其所。”霸权亦随这位统帅的离去而消散。\n此后希腊进入真正的城邦危机：没有哪个城邦能建立稳定秩序，同盟战争连绵不断（神圣战争打了两场）；雇佣兵取代公民兵成为战场主力，将军们为波斯和国外雇主带兵打仗；贫富分化加剧，债务与土地兼并让公民兵源枯竭；雄辩家伊索克拉底呼吁希腊人停止内斗、联合东征波斯“取之不尽的财富”；哲学家开始质疑城邦制度本身。就在希腊诸邦陷入内耗泥潭之时，北方马其顿王国正在腓力二世手中悄悄崛起——一个新时代的阴影已经逼近。',
          quiz: '公元前4世纪希腊城邦危机表现在哪些方面？其根源是什么？',
          answer: '危机的表现：一、霸权更迭频繁却无一稳定——斯巴达、底比斯相继称霸又迅速衰落，希腊再无公认的领袖；二、公民兵制度瓦解，职业雇佣兵成为作战主力，军队效忠金钱而非城邦；三、社会矛盾激化，土地兼并与债务使小农破产、贫富对立尖锐，大地产者与无地者冲突不断；四、城邦间战争连绵（同盟战争、神圣战争），城邦独力难支，只能依附霸权或波斯金钱；五、思想界出现对城邦制度的怀疑，犬儒与伊壁鸠鲁式的个人主义开始流行。其根源在于城邦体制本身的局限：小国寡民、排他的公民权、以邻为壑的经济模式，无法容纳伯罗奔尼撒战争后扩张的社会与经济现实——城邦的框架已经装不下希腊的野心，统一或更大的政治体成为客观需要，马其顿恰好填补了这一真空。' },
        { era: '马其顿崛起与亚历山大东征', time: '公元前359—前323年 · 从王国到世界帝国',
          text: '马其顿位于希腊北部边陲，长期被希腊人视为半野蛮之地。前 359 年腓力二世即位后彻底改造了这个王国：他少年时曾在底比斯做人质三年，亲眼观察了伊巴密浓达的斜线战术，回国后创建以“萨里沙长矛”（长达五至六米）武装的密集方阵，辅以精锐的“伙友骑兵”——方阵正面顶住敌军，骑兵侧翼决定性突击，这套合成战术让马其顿军成为希腊世界最强的战争机器。他开发潘盖翁山金矿充实战费、改革币制，并以婚姻同盟编织外交网络（先后七次联姻）。希腊城邦中只有雄辩家德摩斯梯尼不断发表《斥腓力》演说警告“腓力危险”，却被多数人当耳边风。前 338 年喀罗尼亚之战，腓力大破雅典与底比斯联军（他十八岁的儿子亚历山大率左翼骑兵击穿了“神圣战队”），希腊城邦的独立时代宣告终结；他组建“科林斯同盟”，自任盟主，策划东征波斯。前 336 年腓力在女儿婚宴上被近身护卫刺杀，二十岁的儿子亚历山大继位。\n亚历山大的传奇从少年时代就已开始：别人驯不服的烈马布西法拉斯，他看出马只是怕自己的影子，便把马头转向太阳，纵身骑上——腓力激动地说：“我的儿子，去找一个配得上你的王国吧，马其顿太小了。”他后来师从亚里士多德三年，随身把《伊利亚特》与亚里士多德的批校本带在枕下。继位后他闪电般平定希腊反叛（血洗底比斯），随后把希腊事务交给安提帕特，前 334 年亲率三万余部队渡海东征——出征前他把家产几乎全部分给部下，有人问他给自己留了什么，他答：“希望。”\n东征的进程势如破竹：小亚格拉尼库斯河首战告捷；前 333 年伊苏斯之战击溃大流士三世亲征，俘获波斯王的母亲、王后与幼子——亚历山大以王室之礼相待，传为佳话；他拒绝大流士以半个帝国换和平的求和：“我要的是整个帝国。”经七个月围攻推罗、进军埃及（被尊为法老、建亚历山大里亚城），前 331 年高加米拉之战彻底摧毁波斯主力，随后巴比伦、苏萨、波斯波利斯相继陷落——在波斯王的宫殿，酩酊的亚历山大受雅典名妓泰依丝煽动，点燃了宫殿，为薛西斯焚毁雅典复仇。大流士死于部下之手，亚历山大以王礼安葬并诛杀叛臣，波斯帝国灭亡。他一路东进直达印度河流域，在希达斯佩斯河以步兵对抗两百头战象再次获胜，但爱马布西法拉斯死于该役，他在原地建城纪念；部下再也拒绝东进，他三次下令都无人响应，只好掉头。前 323 年，年仅三十二岁的亚历山大在巴比伦病逝（一说热病，一说中毒），临终前部下问帝国留给谁，他答：“给最强的人。”帝国随即陷入继业者混战。\n亚历山大的东征不止是军事征服：他沿路建起数十座“亚历山大里亚”，鼓励马其顿人与波斯人通婚（自己和一百名伙伴集体迎娶波斯贵族之女），让波斯少年学习希腊语、学习马其顿战术——尽管帝国在他死后立即分裂，但希腊文明已随他的脚步播撒到了整个西亚与北非。',
          quiz: '亚历山大东征为什么能在短短十年间取得如此巨大的成功？',
          answer: '军事上：腓力二世留下的马其顿方阵与伙友骑兵体系是当时世界上最先进的合成军制，亚历山大又具备天才的战场指挥（斜击战术、骑兵决定性突击）与身先士卒的个人魅力。政治上：波斯帝国外强中干，西部总督割据、宫廷内斗，被征服的埃及、巴比伦等民族对波斯统治早有怨恨，亚历山大以“解放者”姿态出现并尊重当地宗教习俗。战略上：他采取了先消灭波斯野战军、再夺取其权力中心的正确次序，并妥善处理大流士死后波斯正统的继承问题以稳定局势。此外，师从亚里士多德的开阔视野使他不止于征服，更致力于建立城市、传播希腊文化，使征服能够转化为持久的“希腊化”进程。' },
        { era: '希腊化时代：文明的大融合', time: '公元前323—前30年 · 从亚历山大到克娄巴特拉',
          text: '亚历山大猝死后没有继承人，部将们为瓜分帝国混战了四十余年（史称“继业者战争”）：佩尔狄卡斯被部下刺杀，托勒密把亚历山大的灵柩劫到埃及，前 301 年伊普苏斯之战，八十岁的塞琉古联合各方击毙最强的安提柯。帝国最终裂解为三大王国：托勒密王朝统治埃及（以亚历山大里亚为都）、塞琉古王朝统治西亚、安提柯王朝统治马其顿与希腊本土。虽然政治分裂，但一个横跨欧亚非的“希腊化世界”却真正成型：希腊语（共同语 Koine）成为从马赛到阿富汗的通用语言，希腊式的城市、剧场、体育馆、币制遍布东方，连远在印度的阿育王石刻诏书里，都列着五位希腊化君王的名字。\n这个时代最耀眼的学术之都，是埃及托勒密王朝营建的亚历山大里亚。托勒密一世设立“博物馆”（Museum，意为缪斯女神的神殿），汇聚了全地中海的学者，由国家供养研究；与之配套的图书馆号称收藏四五十万卷纸草卷，据说凡入港的船只都要把藏书借来抄录。欧几里得在这里写下《几何原本》——当托勒密王问有没有学习几何的捷径时，他答出那句名言：“几何学无王道。”埃拉托色尼用一口井的日影测出地球周长，与真实值仅差百分之几；阿里斯塔克提出地球绕太阳转的日心说，超前了一千八百年；发明螺旋提水的阿基米德（生于西西里的叙拉古）在罗马士兵攻城时还在沙盘上画几何图形，留下的遗言是“别踩坏我的圆”。医学家赫罗菲卢斯则在这里进行了系统的人体解剖。\n思想也随时代转向：在庞大帝国与连绵战争面前，城邦公民的身份失去意义，哲学从“理解世界”转向“安顿个人”——伊壁鸠鲁教人以简单的快乐换取心灵的宁静，芝诺的斯多葛学派主张顺应自然、克制激情，犬儒第欧根尼的传人唾弃一切世俗价值；东方的占星与救赎宗教西传，犹太学者甚至在亚历山大里亚把《希伯来圣经》译成希腊语（“七十士译本”），希腊化的犹太哲人斐洛尝试用柏拉图解释摩西——东西方思想在这里第一次深度交融。希腊化世界由此成为罗马与基督教文明共同的预处理车间。',
          quiz: '希腊化时代与古典时代相比，文明形态发生了哪些主要变化？',
          answer: '政治上：城邦自治的传统让位于王国官僚制与君主崇拜，个人与统治者、与庞大国家的关系取代了城邦公民生活成为政治主题。文化上：从城邦的本土宗教与公民伦理，转向个人化的哲学（斯多葛追求内心安宁、伊壁鸠鲁追求快乐、犬儒唾弃世俗）与拯救型宗教；希腊文化与埃及、波斯、印度文化深度交融，形成兼具东西方元素的混合文明。学术上：学术中心从雅典转移到亚历山大里亚的博物馆与图书馆，欧几里得整理几何学、埃拉托色尼测算地球周长、阿基米德（叙拉古）奠定力学，科学开始与王权资助的大型研究机构结合。社会心理上：在大帝国与战争面前，个人从“城邦的公民”变为“世界的一员”，“世界主义”（Cosmopolis）观念取代了狭隘的城邦认同——这正是它为罗马乃至现代世界准备的思想遗产。' },
        { era: '希腊的终结与不朽的遗产', time: '公元前146—前30年 · 被征服的征服者',
          text: '希腊化王国的混战给了罗马可乘之机。前 168 年罗马在彼得那战役灭马其顿安提柯王朝；前 146 年马其顿成为罗马行省，同一年科林斯被罗马执政官穆米乌斯夷平——城里的科林斯青铜艺术品被成船运往罗马熔铸，罗马人甚至发明了“科林斯青铜”这个词。希腊本土正式落入罗马统治。前 86 年苏拉攻陷雅典：围城中的雅典人粮尽弹绝，以橡子和磨碎的皮革充饥，城破后苏拉的士兵在街头见人就杀，亚里士多德吕克昂学园的遗存也毁于战火。前 31 年亚克兴海战，屋大维击败安东尼与埃及女王克娄巴特拉七世；前 30 年克娄巴特拉以毒蛇自尽（传说如此），托勒密王朝灭亡——政治上的希腊从此消亡了。\n但文化上的希腊反过来征服了罗马：罗马贵族为希腊教师、修辞学家支付高价，让子弟背诵荷马；罗马的雕塑多是对希腊原作的复制品，罗马的诸神干脆对应改写自奥林匹斯诸神；贺拉斯的名言道尽一切：“被征服的希腊反过来征服了野蛮的胜利者。”罗马人自己也不讳言——皇帝尼禄宣布希腊人免缴赋税，哈德良皇帝在雅典重建城市，图拉真的遗嘱指定由希腊学者照顾他的遗体。\n古希腊留给人类的遗产无可估量：政治上，雅典民主与城邦自治是现代民主制度的思想源头；哲学上，从自然哲学到苏格拉底的自省、柏拉图的理念、亚里士多德的逻辑，奠定了西方全部哲学的问题域与方法；科学上，欧几里得几何学、阿基米德力学、希波克拉底医学开创了理性求证的传统；文学上，荷马史诗与希腊悲剧至今仍是西方文学的母题库；奥林匹克运动会更是成为全人类的共同节日。\n更深层地看，希腊人贡献的是一种思维方式：不满足于“是什么”，而追问“为什么”与“凭什么”——用理性审视传统、用论证代替强权、用公共辩论解决分歧。文艺复兴复兴的是希腊，现代科学与民主制度回望的还是希腊。正如雪莱所说：“我们都是希腊人。”这，就是古希腊文明穿越两千五百年依然鲜活的答案。',
          quiz: '为什么说“古希腊文明是西方文明的源头”？请结合政治、思想、科学三方面说明。',
          answer: '政治上，雅典民主确立的主权在民、公民平等参与、抽签与选举、法治与公民辩论等原则，构成现代民主政治的观念原型（尽管其公民范围有历史局限）。思想上，希腊哲学开创了以理性追问本原、以逻辑论证观点、以自省审视人生的传统，苏格拉底“未经审视的人生不值得过”至今是理性精神的座右铭；柏拉图与亚里士多德的体系成为西方哲学的全部问题域。科学上，欧几里得的公理化方法、阿基米德的实验与数学结合、希波克拉底的观察与伦理，确立了“从观察出发、以论证求真”的科学范式。三者共同构成西方文明从制度、精神到方法论的底座——文艺复兴、启蒙运动与现代科学，本质上都是不同时代对希腊源头的重新发掘，因此说古希腊是西方文明的源头。' }
      ];
      (function () {
        var d = new Date();
        var day = Math.floor(d.setHours(0, 0, 0, 0) / 86400000);
        var today = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
        var cur = day % GREEK_POOL.length;
        var paras = [], gkTotal = 1, gkCur = 0;
        var tocEl = document.getElementById('gkToc');
        GREEK_POOL.forEach(function (a, i) {
          var li = document.createElement('li');
          var b = document.createElement('button');
          b.type = 'button';
          b.textContent = (i + 1) + '. ' + a.era;
          b.dataset.idx = i;
          b.addEventListener('click', function () { renderGreek(i); });
          li.appendChild(b);
          tocEl.appendChild(li);
        });
        function updateToc() {
          var btns = tocEl.querySelectorAll('button');
          for (var i = 0; i < btns.length; i++) { btns[i].className = (i === cur) ? 'active' : ''; }
        }

        function gkShow() {
          var start = gkCur * 2;
          document.getElementById('gkText').textContent = paras.slice(start, start + 2).join('\n\n');
          document.getElementById('gkPage').textContent = '第 ' + (gkCur + 1) + ' / ' + gkTotal + ' 页';
          document.getElementById('gkPrev').disabled = gkCur === 0;
          document.getElementById('gkNext').disabled = gkCur >= gkTotal - 1;
        }

        function renderGreek(idx) {
          cur = ((idx % GREEK_POOL.length) + GREEK_POOL.length) % GREEK_POOL.length;
          var a = GREEK_POOL[cur];
          document.getElementById('gkDate').textContent = '第 ' + (cur + 1) + ' / ' + GREEK_POOL.length + ' 讲 · ' + today;
          document.getElementById('gkTopic').textContent = a.era;
          document.getElementById('gkMeta').textContent = a.time;
          paras = a.text.split('\n\n');
          gkTotal = Math.max(1, Math.ceil(paras.length / 2));
          gkCur = 0;
          document.getElementById('gkQuestion').textContent = a.quiz;
          var ansEl = document.getElementById('gkAnswer');
          ansEl.style.display = 'none';
          document.getElementById('gkAnswerBtn').textContent = '显示参考答案';
          ansEl.textContent = '参考答案：' + a.answer;
          gkShow();
          updateToc();
        }

        renderGreek(cur);
        document.getElementById('gkPrev').addEventListener('click', function () { if (gkCur > 0) { gkCur--; gkShow(); } });
        document.getElementById('gkNext').addEventListener('click', function () { if (gkCur < gkTotal - 1) { gkCur++; gkShow(); } });
        document.getElementById('gkAnswerBtn').addEventListener('click', function () {
          var ansEl = document.getElementById('gkAnswer');
          var btnEl = document.getElementById('gkAnswerBtn');
          if (ansEl.style.display === 'none') { ansEl.style.display = ''; btnEl.textContent = '收起答案'; }
          else { ansEl.style.display = 'none'; btnEl.textContent = '显示参考答案'; }
        });
        document.getElementById('gkNextLec').addEventListener('click', function () { renderGreek(cur + 1); });
      })();
    </script>
