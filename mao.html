    <script>
      var MAO_POOL = [
        { topic: '《中国社会各阶级的分析》', meta: '第一卷 · 1925 年 12 月 · 革命的首要问题',
          text: '这是《毛泽东选集》的开卷第一篇，开篇第一句话就是全文的纲领：“谁是我们的敌人？谁是我们的朋友？这个问题是革命的首要问题。”\n写作背景：第一次国共合作期间，党内存在两种倾向——以陈独秀为代表的右倾只注重同国民党合作、忘记了农民；以张国焘为代表的“左”倾只注重工人运动、同样忘记了农民。两者都感觉自己的力量不足，却不知道到哪里去寻找同盟军。\n毛泽东用马克思主义的阶级分析方法，对中国社会各阶级的经济地位和政治态度逐一解剖：地主阶级和买办阶级是国际资产阶级的附庸，代表中国最落后、最反动的生产关系；民族资产阶级对革命具有矛盾的态度，既需要革命又怀疑革命；小资产阶级内部的左中右三翼，在革命高潮时会“从拿破仑式变为华盛顿式”；半无产阶级（绝大部分半自耕农、贫农、小手工业者、店员、小贩）处境艰难，是革命的最广大同盟军；工业无产阶级人数虽不多，却是新的生产力的代表，是近代中国最进步的阶级，做了革命运动的领导力量。\n文章的结论：一切勾结帝国主义的军阀、官僚、买办阶级、大地主阶级以及附属于他们的一部分反动知识界，是我们的敌人；工业无产阶级是我们革命的领导力量；一切半无产阶级、小资产阶级，是我们最接近的朋友。那一时期军阀和买办豪绅阶级豢养的“反动知识界”——“国家主义派”和国民党右派——则是真正的敌人。\n这篇文章确立的分析框架，成为此后二十多年中国革命制定路线方针的基本依据：革命的首要问题永远是分辨敌友，而分辨敌友的科学工具，是阶级分析。',
          quotes: ['谁是我们的敌人？谁是我们的朋友？这个问题是革命的首要问题。', '工业无产阶级是我们革命的领导力量。一切半无产阶级、小资产阶级，是我们最接近的朋友。'] },
        { topic: '《湖南农民运动考察报告》', meta: '第一卷 · 1927 年 3 月 · 实地考察 32 天', text: '北伐战争期间，湖南的农民运动风起云涌，数百万农民组织进农会，冲击地主的权威。党内外一片责难之声，说农民运动“糟得很”、是“痞子运动”“惰农运动”；连党内右倾机会主义者也指责它“过火”。\n为了回答这个争论，毛泽东以国民党中央候补执行委员的身份，实地考察了湘潭、湘乡、衡山、醴陵、长沙五县，历时三十二天。他在报告中给出截然相反的判断：农民运动“好得很”，是完全正确的、革命的。\n报告用大量亲身见闻，列举了农民协会办的“十四件大事”：将农民组织在农会里、政治上打击地主、经济上打击地主、推翻土豪劣绅的封建统治、推翻地主武装建立农民武装、推翻县官老爷衙门差役的政权、推翻祠堂族长的族权和城隍土地菩萨的神权、普及政治宣传、农民诸禁、清匪、废苛捐、文化运动、合作社运动、修道路修塘坝。\n报告中最著名的论断是：贫农是“革命先锋”，是“革命的元勋”，斥责农民运动的人是站在地主利益方面的。他还写下了那段气魄惊人的预言：“很短的时间内，将有几万万农民从中国中部、南部和北部各省起来，其势如暴风骤雨，迅猛异常，无论什么大的力量都将压抑不住。他们将冲决一切束缚他们的罗网，朝着解放的路上迅跑。”\n这篇文章不仅是对一个省的调查，更奠定了“农民是中国革命主力军”的思想基础——农村包围城市道路的理论源头，就在这里。', quotes: ['革命不是请客吃饭，不是做文章，不是绘画绣花，不能那样雅致，那样从容不迫，文质彬彬，那样温良恭俭让。革命是暴动，是一个阶级推翻一个阶级的暴烈的行动。', '很短的时间内，将有几万万农民从中国中部、南部和北部各省起来，其势如暴风骤雨，迅猛异常。'] },
        { topic: '《中国的红色政权为什么能够存在？》', meta: '第一卷 · 1928 年 10 月 · 井冈山时期', text: '大革命失败后，秋收起义受挫，毛泽东率部上了井冈山，建立起中国第一个农村革命根据地。但在白色政权的四面“会剿”之下，党内和军内弥漫着悲观情绪：“红旗到底打得多久”的疑问反复出现。这篇写于 1928 年 10 月的文章，就是对这个根本问题的正式回答。\n文章首先分析了中国红色政权发生和存在的五个独特条件：一是中国是一个政治经济发展极不平衡的半殖民地半封建大国——地方性的农业经济（而不是统一的资本主义经济）和帝国主义划分势力范围的分裂剥削政策，造成了白色政权间的长期分裂和战争，给红色政权的发生和发展以可乘之机；二是红色政权首先在受过大革命影响的地区发生；三是全国革命形势是继续向前发展的；四是相当力量的正式红军的存在；五是共产党组织的有力量和它的政策的不错误。\n在分析基础上，文章系统提出了“工农武装割据”的思想：在党的领导下，以武装斗争为主要形式，以土地革命为中心内容，以农村根据地为战略阵地，三者密切结合。文章还专门强调了经济问题和根据地建设问题，批评了只顾军事而忽视根据地建设、想在湘赣边界“太作军事割据”的错误倾向。\n这篇文章与四个月后的《井冈山的斗争》一起，从理论上论证了农村包围城市道路的起点：在敌人统治薄弱的农村建立根据地，星星之火，可以燎原。', quotes: ['“红旗到底打得多久”的疑问是经常发生的。', '工农武装割据的思想，是共产党和割据地方的工农群众必须充分具备的一个重要的思想。'] },
        { topic: '《关于纠正党内的错误思想》', meta: '第一卷 · 1929 年 12 月 · 古田会议决议', text: '这是 1929 年 12 月福建上杭古田会议决议的第一部分，也是人民军队建设史上最重要的文献之一。\n当时红军刚刚诞生两年多，主要成分是农民和旧军队出身的人员，各种非无产阶级思想大量存在：单纯军事观点（认为军事领导政治）、极端民主化（要求红军中 absolute 民主）、非组织观点、绝对平均主义、主观主义、个人主义、流寇思想（不愿做建立根据地的艰苦工作，只想流动游击）、盲动主义残余。这些思想若不纠正，红军就会有脱离无产阶级领导的危险。\n文章逐一分析了这些错误思想的表现、来源和纠正办法，并第一次明确了红军的性质与任务：红军是执行革命的政治任务的武装集团——军事只是完成政治任务的工具之一，红军绝不能离政治，也绝不能只打仗，还要负担宣传群众、组织群众、武装群众、帮助群众建立革命政权以至于建立共产党的组织等项重大的任务。\n由此确立的原则是：党对军队的绝对领导——党的领导机关要成为部队领导的“中枢”；在组织上，厉行集中指导下的民主，建立党委制、政治委员制度、政治部制度。这就是后来被概括为“党指挥枪”的建军原则。\n古田会议决议与《星星之火，可以燎原》一起，解决了“建设一支什么样的军队、怎样建设这支军队”的根本问题。今天人民军队的政治工作制度、党支部建在连上，都可以追溯到这份九十年前的文献。', quotes: ['红军是执行革命的政治任务的武装集团。', '党对军队的绝对领导，是人民军队建军的根本原则。'] },
        { topic: '《星星之火，可以燎原》', meta: '第一卷 · 1930 年 1 月 · 农村包围城市道路的形成', text: '1930 年元旦，时任红四军第一纵队司令的林彪给毛泽东写信，对时局的估量比较悲观，提出“红旗到底打得多久”的疑问。毛泽东决定用一封公开回信来系统回答，这就是《星星之火，可以燎原》。\n文章首先批评了那种“全国范围的、包括一切地方的、先争取群众后建立政权的理论”，指出那是于中国革命的实情不适合的。中国的国情不同于资本主义国家：在敌人长期统治的城市中，革命力量无法积聚；而在反动统治薄弱的广大农村，红色政权却能够存在和发展。因此中国革命的正确道路是：在敌人统治薄弱的农村建立巩固的红色政权，以乡村为中心，用红军和根据地去促进全国革命高潮。\n文章预言革命高潮快要到来，但“快”不是机械的时间表——它不是可望而不可即的一种空的东西，而“是站在海岸遥望海中已经看得见桅杆尖头了的一只航船，它是立于高山之巅远看东方已见光芒四射喷薄欲出的一轮朝日，它是躁动于母腹中的快要成熟了的一个婴儿”。\n这篇文章标志着农村包围城市、武装夺取政权道路理论的正式形成，是毛泽东思想开始形成的重要标志。历史证明了这个判断：二十年后，从井冈山的星星之火，燃遍全中国。', quotes: ['星星之火，可以燎原。', '它是站在海岸遥望海中已经看得见桅杆尖头了的一只航船，它是立于高山之巅远看东方已见光芒四射喷薄欲出的一轮朝日。'] },
        { topic: '《反对本本主义》', meta: '第一卷 · 1930 年 5 月 · 没有调查，就没有发言权', text: '这篇文章原题为《调查工作》，写于 1930 年 5 月，是毛泽东为了反对当时红军中的教条主义思想而写的。文章一度散佚，直到 1959 年才在福建龙岩重新发现，1961 年收入《毛泽东选集》时改为现题。\n文章的第一句话就是那句传遍全党的名言：“没有调查，没有发言权。”毛泽东批评党内一部分人安于现状、不求甚解，饱食终日、不注意调查研究和经济工作——他们对上级的指示和马克思主义的“本本”照抄照搬，“以为上了书的就是对的”。\n文章的核心观点有三：一是“调查就是解决问题”——“你对于那个问题不能解决么？那么，你就去调查那个问题的现状和它的历史吧……一切结论产生于调查情况的末尾，而不是在它的先头”；二是“中国革命斗争的胜利要靠中国同志了解中国情况”——马克思主义的“本本”是要学习的，但是必须同我国的实际情况相结合；三是反对瞎说，提倡“迈开你的两脚，到你的工作范围的各部分各地方去走走”。\n这篇文章是毛泽东“实事求是”思想路线的最早萌芽。耐人寻味的是它散佚三十年的经历：一条强调“没有调查就没有发言权”的真理，恰恰要靠重新调查研究才能找回——1961 年重新读到它时，毛泽东自己也感慨，这篇文章正是针对当时党内的教条主义写的。', quotes: ['没有调查，没有发言权。', '中国革命斗争的胜利要靠中国同志了解中国情况。'] },
        { topic: '《实践论》', meta: '第一卷 · 1937 年 7 月 · 论认识和实践的关系——知和行的关系', text: '《实践论》原是毛泽东 1937 年 7 月在延安抗日军事政治大学讲授哲学时的讲义《辩证法唯物论（讲授提纲）》中的一节。写作的背景极其沉痛：此前王明“左”倾教条主义使白区党组织几乎损失百分之百、苏区损失百分之九十——照抄马克思主义本本、不看中国实际，让革命付出了血的代价。《实践论》要解决的，就是从认识论上清算这种错误。它还有一个副标题：“论认识和实践的关系——知和行的关系”，直接接续了中国哲学史上绵延两千年的知行之辩。\n文章的核心观点：认识来源于实践；认识的发展经历两个阶段——感性认识（感觉和印象）上升为理性认识（概念、判断、推理）；而理性认识还必须回到实践中去接受检验、指导实践。“实践、认识、再实践、再认识，这种形式，循环往复以至于无穷，而实践和认识之每一循环的内容，都比较地进到了高一级的程度。”这就是认识运动的总规律。文中那句最形象的比喻——“你要知道梨子的滋味，你就得变革梨子，亲口吃一吃”——说的正是：要知道，就得变革对象；要在变革中求知。\n由此引出真理的判据：“真理的标准只能是社会的实践。”主观是否符合客观，靠头脑里的推演无法证明，只有拿到改造客观世界的实践中去检验。这个判据后来演化为那句家喻户晓的“实践是检验真理的唯一标准”。\n《实践论》和两个月后的《矛盾论》并称“两论”，是毛泽东哲学思想的代表作，也是马克思主义中国化的哲学基石。它批判的两种错误——教条主义（轻视实践、唯书唯上）和经验主义（轻视理论、埋头盲干）——今天依然是每个学习者、工作者都会掉进的陷阱：读书代替不了做事，做事之后不复盘又回到原点——“实践、认识、再实践、再认识”的循环，对个人的成长同样成立。', quotes: ['你要知道梨子的滋味，你就得变革梨子，亲口吃一吃。', '真理的标准只能是社会的实践。'] },
        { topic: '《矛盾论》', meta: '第一卷 · 1937 年 8 月 · 对立统一法则', text: '《矛盾论》是“两论”的下半篇，写于 1937 年 8 月，最初也是抗大讲授提纲中的一节。如果说《实践论》讲的是“知与行”的关系，《矛盾论》讲的就是“如何看待事物的运动与变化”。\n文章开宗明义：“事物的矛盾法则，即对立统一的法则，是唯物辩证法的最根本的法则。”全文围绕六个方面展开：两种宇宙观（形而上学的孤立静止观点 vs 辩证法的联系发展观点）；矛盾的普遍性（矛盾无处不在、无时不有）；矛盾的特殊性（不同事物、不同阶段的矛盾各有特点）；主要的矛盾和主要的矛盾方面（复杂过程中必有一种矛盾是主要矛盾，其决定性作用支配着其他矛盾）；矛盾诸方面的同一性和斗争性；对抗在矛盾中的地位。\n其中流传最广的思想是“具体问题具体分析”——“马克思主义的活的灵魂，就在于具体地分析具体的情况”，以及“这一共性个性、绝对相对的道理，是关于事物矛盾的问题的精髓，不懂得它，就等于抛弃了辩证法”。矛盾的主要方面决定事物性质的论断、抓主要矛盾的“纲举目张”式思维，都深刻影响了中国的思想方法与工作方法。\n《矛盾论》写作时也大量引用了《孙子兵法》的战例与苏联哲学教材，但它的真正贡献是把抽象的辩证法变成了中国人能够掌握的思想武器：任何复杂局面，先找出主要矛盾，再分析矛盾的主要方面，问题就有了下手处。这种抓主要矛盾的方法论，也是“集中优势兵力打歼灭战”等军事原则的哲学根基。', quotes: ['事物的矛盾法则，即对立统一的法则，是唯物辩证法的最根本的法则。', '马克思主义的活的灵魂，就在于具体地分析具体的情况。'] },
        { topic: '《论持久战》', meta: '第二卷 · 1938 年 5 月 · 抗战胜利的方向盘', text: '1938 年 5 月，抗战全面爆发已近一年，中国内部流行着两种截然相反的论调：“亡国论”者悲观失望，认为中国必亡；“速胜论”者盲目乐观，认为再打几个台儿庄式的大捷就能迅速击退日本。毛泽东在延安抗日战争研究会上发表长篇演讲，系统回答了“中国会不会亡？中国能不能速胜？抗战的前途究竟怎样”这三个全民关心的问题。\n文章的核心方法是全面分析中日双方相互矛盾的四个基本特点：日本是强国，但地小、物少、人少、兵少，且其战争是退步的、野蛮的，失道寡助；中国是弱国，但地大、物博、人多、兵多，且其战争是进步的、正义的，得道多助。敌强我弱，决定了中国不能速胜；敌小我大、敌退步我进步、敌寡助我多助，决定了中国不会亡，最后胜利是中国的。\n由此，文章科学预见了抗日战争的三个阶段：战略防御、战略相持、战略反攻——并特别指出，相持阶段“将是整个战争的过渡阶段，也将是最困难的时期，然而它是转变的枢纽”。文章还批驳了唯武器论，指出“武器是战争的重要的因素，但不是决定的因素，决定的因素是人不是物”“战争的伟力之最深厚的根源，存在于民众之中”，提出“兵民是胜利之本”的人民战争思想。\n历史几乎完全按照这部作品的预测发展。《论持久战》不仅指导了中国人民的抗战，白崇禧将其精神概括为“积小胜为大胜，以空间换时间”，并向蒋介石建议作为全国抗战的指导思想。一篇五万字的军事哲学著作，成为决定一个民族命运的预言书。', quotes: ['抗日战争是持久战，最后胜利是中国的——这就是我们的结论。', '战争的伟力之最深厚的根源，存在于民众之中。'] },
        { topic: '《纪念白求恩》', meta: '第二卷 · 1939 年 12 月 · 悼念一位加拿大医生', text: '诺尔曼·白求恩是加拿大共产党员、著名胸外科医生。1938 年他率医疗队来到中国抗日根据地，救死扶伤，创办卫生学校、编写教材。1939 年 10 月，他在河北涞源摩天岭战斗中为伤员施行手术时被刀刃割破手指，感染后恶化转为败血症，11 月 12 日在河北唐县黄石口村逝世，年仅四十九岁。\n12 月 21 日，毛泽东为悼念这位从未谋面（实际上仅一面之缘）的外国医生，写下这篇不足千字的短文。文章概括了白求恩的三种精神：国际主义的精神、毫不利己专门利人的精神、对技术精益求精的精神。\n文章对“两种人”的对比至今读来依然锋利：不少的人对工作不负责任，拈轻怕重，把重担子推给人家，自己挑轻的；一事当前，先替自己打算，然后再替别人打算；出了一点力就觉得了不起，喜欢自吹，生怕人家不知道。对同志对人民不是满腔热忱，而是冷冷清清，漠不关心，麻木不仁。而白求恩——毫不利己专门利人，每个共产党员都要学习他。\n文章结尾提出了那个著名的“五种人”标准，成为几代中国人的道德标尺。一篇千字悼文，为一个外国人立起了一座精神的丰碑——这在世界悼文史上都是罕见的。', quotes: ['一个人能力有大小，但只要有这点精神，就是一个高尚的人，一个纯粹的人，一个有道德的人，一个脱离了低级趣味的人，一个有益于人民的人。', '对工作的极端的负责任，对同志对人民的极端的热忱。'] },
        { topic: '《新民主主义论》', meta: '第二卷 · 1940 年 1 月 · 中国向何处去', text: '1940 年 1 月 9 日，毛泽东在陕甘宁边区文化协会第一次代表大会上作长篇演讲，后来整理成《新民主主义论》。当时的背景是：抗战进行中，“中国向何处去”的问题笼罩着每一个中国人的心——国民党主张“一个主义”“一个党”，各种中间力量也在描绘各自的建国蓝图。\n文章系统回答了中国革命的性质与前途：中国革命必须分两步走——第一步是新民主主义革命，改变半殖民地半封建的社会形态，使中国成为独立的新民主主义社会；第二步是社会主义革命。两步不能毕其功于一役。\n文章描绘了新民主主义共和国的完整蓝图：政治上，建立无产阶级领导下的一切反帝反封建的人们联合专政的民主共和国；经济上，大银行、大工业、大商业归国家所有，没收地主的土地分配给农民，“节制资本”而不没收其他资本主义企业；文化上，建立“民族的科学的大众的文化”——反帝反封建、反对迷信盲从、为全民族百分之九十以上的工农劳苦民众服务。\n文章中还有一句对文化哲学影响深远的话：“民族的科学的大众的文化，就是人民大众反帝反封建的文化，就是新民主主义的文化，就是中华民族的新文化。”这篇著作系统回答了中国革命的对象、任务、动力、性质、前途和转变等基本问题，为未来新中国画出了第一张完整的图纸。', quotes: ['民族的科学的大众的文化，就是人民大众反帝反封建的文化，就是新民主主义的文化。', '新民主主义的政治、新民主主义的经济和新民主主义的文化相结合，这就是新民主主义共和国。'] },
        { topic: '《改造我们的学习》', meta: '第三卷 · 1941 年 5 月 · “实事求是”的完整出处', text: '1941 年 5 月，毛泽东在延安干部会议上作报告，正式拉开了延安整风运动的序幕。与《整顿党的作风》《反对党八股》一起，这三篇文献被称为整风“三报”。\n《改造我们的学习》批判的对象是主观主义——包括两种形态：教条主义（唯书、唯上、唯苏联指示）和经验主义（埋头日常事务、轻视理论）。文章讽刺这种人为“墙上芦苇，头重脚轻根底浅；山间竹笋，嘴尖皮厚腹中空”——华而不实，没有科学的态度。\n文章对“实事求是”做出了完整的经典阐释：“‘实事’就是客观存在着的一切事物，‘是’就是客观事物的内部联系，即规律性，‘求’就是我们去研究。我们要从国内外、省内外、县内外、区内外的实际情况出发，从其中引出其固有的而不是臆造的规律性，即找出周围事变的内部联系，作为我们行动的向导。”\n文章还将主观主义的态度与马克思列宁主义的态度对举：前者“仅仅根据想当然，或者根据大概情况的估计”发号施令；后者“应用马克思列宁主义的理论和方法，对周围环境作系统的周密的调查和研究”。\n延安整风运动确立了“实事求是”作为党的思想路线，此后“理论联系实际”“密切联系群众”“批评与自我批评”成为党的三大作风。今天，这四个字刻在很多机关与学校的墙上——它的出处，就是这篇整风报告。', quotes: ['“实事”就是客观存在着的一切事物，“是”就是客观事物的内部联系，即规律性，“求”就是我们去研究。', '墙上芦苇，头重脚轻根底浅；山间竹笋，嘴尖皮厚腹中空。'] },
        { topic: '《反对党八股》', meta: '第三卷 · 1942 年 2 月 · 历数“八大罪状”', text: '延安整风“三报”的最后一篇，1942 年 2 月 8 日在延安干部会上演讲。文章针对的是当时党内文件和宣传中泛滥的“党八股”——一种形式主义、空洞无物的文风。\n文章以痛快淋漓的笔法，历数党八股的“八大罪状”：一曰空话连篇，言之无物；二曰装腔作势，借以吓人；三曰无的放矢，不看对象；四曰语言无味，像个瘪三；五曰甲乙丙丁，开中药铺（罗列现象罗列条文，不提出问题分析问题）；六曰不负责任，到处害人；七曰流毒全党，妨害革命；八曰传播出去，祸国殃民。\n文章的名句至今被广泛引用于批评文风：“我们反对主观主义和宗派主义，如果不连党八股也给以清算，那它们就还有一个藏身的地方，它们还可以躲起来。”“语言这东西，不是随便可以学好的，非下苦功不可。”文章还号召学习人民的语言——要向人民群众学习语言，要从外国语言中吸收我们所需要的成分，还要学习古人语言中有生命的东西。\n八十多年过去，这“八条罪状”几乎条条都能在今天的公文、报告、PPT 和新媒体文中找到对应物。这篇文章与其说是一篇整风文献，不如说是一份永远有效的文风体检表。', quotes: ['党八股这个形式，不但不便于表现革命精神，而且非常容易使革命精神窒息。', '语言这东西，不是随便可以学好的，非下苦功不可。'] },
        { topic: '《在延安文艺座谈会上的讲话》', meta: '第三卷 · 1942 年 5 月 · 文艺为什么人的问题', text: '1942 年 5 月，延安聚集了大批从全国各地投奔而来的文化人，文艺界在“歌颂光明还是暴露黑暗”“文艺为什么人服务”等问题上分歧激烈。毛泽东分两次（5 月 2 日和 23 日）主持座谈会并作结论讲话，这就是《在延安文艺座谈会上的讲话》。\n讲话的核心问题只有一个：“文艺是为什么人的？”毛泽东的回答毫不含糊：为人民大众——首先是为工农兵服务。“为什么人的问题，是一个根本的问题，原则的问题。”\n讲话还系统论述了几个重要关系：文艺与政治的关系（文艺服从于政治，但政治并不等于艺术）；普及与提高的关系（在普及基础上的提高，在提高指导下的普及）；文艺源于生活又高于生活——“人民生活中本来存在着文学艺术原料的矿藏……它们是一切文学艺术的取之不尽、用之不竭的唯一的源泉”；批判“人性论”和“写光明与写黑暗并重”的主张。\n这篇讲话确定了中国文艺此后数十年的基本方向，催生了《白毛女》等一批经典作品；1976 年后关于它的争论也从未停止——但“文艺为什么人”这个问题本身，至今仍是每个创作者必须回答的问题。', quotes: ['为什么人的问题，是一个根本的问题，原则的问题。', '人民生活中本来存在着文学艺术原料的矿藏……它们是一切文学艺术的取之不尽、用之不竭的唯一的源泉。'] },
        { topic: '《为人民服务》', meta: '第三卷 · 1944 年 9 月 · 一个普通战士的追悼会', text: '1944 年 9 月 8 日，延安凤凰山下，中央警备团为普通战士张思德举行追悼会。张思德是四川仪陇人，长征老战士，调到延安后负责烧炭工作——9 月 5 日，陕北安塞的炭窑突然崩塌，他为救战友牺牲，年仅二十九岁。\n毛泽东亲自参加追悼会，并发表了这篇不到八百字的演讲。演讲开篇就点明了中国共产党的根本宗旨：“我们的共产党和共产党所领导的八路军、新四军，是革命的队伍。我们这个队伍完全是为着解放人民的，是彻底地为人民的利益工作的。”\n演讲引用司马迁的话来评价生死：“人固有一死，或重于泰山，或轻于鸿毛。”张思德是为人民利益而死的，他的死比泰山还要重。演讲还说到了批评：“因为我们是为人民服务的，所以，我们如果有缺点，就不怕别人批评指出。不管是什么人，谁向我们指出都行。只要你说得对，我们就改正。你说的办法对人民有好处，我们就照你的办。”——文中提到的“精兵简政”提案，正是党外人士李鼎铭提出的。\n这篇演讲为一位普通战士而作，却确立了中国共产党的根本宗旨。“为人民服务”五个大字后来刻在中南海新华门的影壁上，成为这个政党最简明也最经受检验的承诺。', quotes: ['我们这个队伍完全是为着解放人民的，是彻底地为人民的利益工作的。', '人固有一死，或重于泰山，或轻于鸿毛。'] },
        { topic: '《愚公移山》', meta: '第三卷 · 1945 年 6 月 · 中共七大闭幕词', text: '1945 年 6 月 11 日，中国共产党第七次全国代表大会闭幕。毛泽东致闭幕词，全文不到一千五百字，却成为流传最广的文献之一。这就是《愚公移山》。\n文章先讲了一个《列子·汤问》里的寓言：北山愚公年近九十，面对太行、王屋两座大山挡路，率领子孙挖山不止，智叟讥笑他自不量力，他回答“子子孙孙无穷匮也，而山不加增，何苦而不平？”最终天帝被感动，命神仙把山背走。\n毛泽东赋予寓言全新的现实含义：“现在也有两座压在中国人民头上的大山，一座叫做帝国主义，一座叫做封建主义。中国共产党早就下了决心，要挖掉这两座大山。我们一定要坚持下去，一定要不断地工作，我们也会感动上帝的。这个上帝不是别人，就是全中国的人民大众。”\n文章的结语后来成为传遍全国的十六字口号：“下定决心，不怕牺牲，排除万难，去争取胜利。”\n中共七大还确立了毛泽东思想作为党的指导思想，这次闭幕词用一则寓言为整场大会画上句号：把宏大的政治目标，化为每个普通人都能理解、都能参与的一锹一铲。这正是它历久弥新的原因。', quotes: ['下定决心，不怕牺牲，排除万难，去争取胜利。', '这个上帝不是别人，就是全中国的人民大众。'] },
        { topic: '《抗日战争胜利后的时局和我们的方针》', meta: '第四卷 · 1945 年 8 月 · 针锋相对，寸土必争', text: '1945 年 8 月，日本宣布无条件投降。八年抗战胜利了，但一个新的问题立刻摆在面前：蒋介石下一步要做什么？这篇文章就是毛泽东在延安干部会议上的讲演，回答抗战胜利后中国的走向。\n文章的判断极为清醒：蒋介石发动内战的方针“早已定了”，但他要发动内战还有许多困难——解放区壮大、解放区人心归向、国民党内部矛盾、全国人民的反对。因此时局是“内战危险十分严重，但内战不是马上就要全面爆发”。\n针对国民党“寸权必夺，寸利必得”的方针，毛泽东提出了针锋相对的方针：“我们的方针是针锋相对，寸土必争。”他明确驳斥了当时党内一些人主张交出军队换取官职的想法，用形象的语言说：“人民得到的权利，绝不允许轻易丧失，必须用战斗来保卫。”他还用幽默的比喻说明了“针锋相对”的含义：蒋介石磨刀了，我们也要磨刀。', quotes: ['蒋介石对于人民是寸权必夺，寸利必得。我们呢？我们的方针是针锋相对，寸土必争。', '人民得到的权利，绝不允许轻易丧失，必须用战斗来保卫。'] },
        { topic: '《和美国记者安娜·路易斯·斯特朗的谈话》', meta: '第四卷 · 1946 年 8 月 · 一切反动派都是纸老虎', text: '1946 年 8 月，美国记者安娜·路易斯·斯特朗到延安采访毛泽东。当时解放战争刚刚全面爆发，国民党军队在兵力和装备上占据绝对优势，美国又刚刚在日本投下两颗原子弹。斯特朗问毛泽东：如果美国使用原子弹轰炸，共产党怎么办？\n毛泽东的回答成为他一生流传最广的论断：“一切反动派都是纸老虎。看起来，反动派的样子是可怕的，但是实际上并没有什么了不起的力量。从长远的观点看问题，真正强大的力量不是属于反动派，而是属于人民。”\n谈话中他还进一步解释：“原子弹是美国反动派用来吓人的一只纸老虎，看样子可怕，实际上并不可怕。当然，原子弹是一种大规模屠杀的武器，但是决定战争胜败的是人民，而不是一两件新式武器。”\n这次谈话的英文译文最初发表时，翻译把“纸老虎”译为 scarecrow（稻草人），毛泽东坚持应为 paper tiger——因为纸老虎是纸做的老虎，“看起来可怕，雨一淋就完了”。“纸老虎”（paper tiger）从此进入英语词汇，成为二十世纪国际政治的经典名词。', quotes: ['一切反动派都是纸老虎。', '决定战争胜败的是人民，而不是一两件新式武器。'] },
        { topic: '《目前形势和我们的任务》', meta: '第四卷 · 1947 年 12 月 · 十大军事原则', text: '1947 年是解放战争的转折之年：刘伯承、邓小平率军千里跃进大别山，人民解放军从战略防御转入战略进攻。12 月 25 日至 28 日，中共中央在陕北米脂县杨家沟召开会议，毛泽东作《目前形势和我们的任务》的报告。\n报告的核心判断是：“中国人民的革命战争，现在已经达到了一个转折点。”这“是蒋介石的二十年反革命统治由发展到消灭的转折点”，也是“一百多年以来帝国主义在中国的统治由发展到消灭的转折点”。\n报告提出了著名的“十大军事原则”，共三百九十余字，高度概括了人民军队的作战方法：先打分散和孤立之敌，后打集中和强大之敌；先取小城市、中等城市和广大乡村，后取大城市；以歼灭敌人有生力量为主要目标，不以保守或夺取城市和地方为主要目标；每战集中绝对优势兵力，四面包围敌人，力求全歼，不使漏网；不打无准备之仗，不打无把握之仗；发扬勇敢战斗、不怕牺牲、不怕疲劳和连续作战的作风；力求在运动中歼灭敌人；一切敌人守备薄弱的据点和城市坚决夺取之；以俘获敌人的全部武器和大部人员补充自己；善于利用两个战役之间的间隙休整部队。\n毛泽东后来自评：十大军事原则“是人民解放军在和国内外敌人长期作战的锻炼中产生出来，并完全适合我们目前的情况的”。报告还宣布了土改总路线和“彻底消灭封建剥削”的土地政策。', quotes: ['中国人民的革命战争，现在已经达到了一个转折点。', '每战集中绝对优势兵力，四面包围敌人，力求全歼，不使漏网。'] },
        { topic: '《在中国共产党第七届中央委员会第二次全体会议上的报告》', meta: '第四卷 · 1949 年 3 月 · “两个务必”与进京赶考', text: '1949 年 3 月，中共中央在河北平山西柏坡召开七届二中全会。此时三大战役已经结束，解放战争胜利在望——全国胜利在即，党该做什么准备？毛泽东在报告中做出了一系列影响深远的判断和规定。\n最重要的判断是：党的工作重心由乡村转移到城市，并且必须“以生产建设为中心”。他告诫全党：“从现在起，开始了由城市到乡村并由城市领导乡村的时期。党的工作重心由乡村移到了城市……但是党和军队的工作重心必须放在城市，必须用极大的努力去学会管理城市和建设城市。”\n报告同时警惕胜利带来的风险：“可能有这样一些共产党人，他们是不曾被拿枪的敌人征服过的，他们在这些敌人面前不愧英雄的称号；但是经不起人们用糖衣裹着的炮弹的攻击，他们在糖弹面前要打败仗。我们必须预防这种情况。”为此提出“两个务必”：“务必使同志们继续地保持谦虚、谨慎、不骄、不躁的作风，务必使同志们继续地保持艰苦奋斗的作风。”会议还做出六条规定：不做寿，不送礼，少敬酒，少拍掌，不以人名作地名，不要把中国同志同马恩列斯平列。\n会后 10 天，毛泽东离开西柏坡进京，途中对周恩来说了那句著名的话：“今天是进京赶考的日子……我们决不当李自成，我们都希望考个好成绩。', quotes: ['夺取全国胜利，这只是万里长征走完了第一步。', '务必使同志们继续地保持谦虚、谨慎、不骄、不躁的作风，务必使同志们继续地保持艰苦奋斗的作风。'] },
        { topic: '《论人民民主专政》', meta: '第四卷 · 1949 年 6 月 · 新中国的蓝图', text: '1949 年 6 月 30 日，中国共产党成立二十八周年前夕，毛泽东发表《论人民民主专政》，系统回答了一个即将成立的新中国最根本的问题：我们建立一个什么样的国家？\n文章开篇就总结了二十八年革命的基本经验：“一个有纪律的，有马克思列宁主义的理论武装的，采取自我批评方法的，联系人民群众的党。一个由这样的党领导的军队。一个由这样的党领导的各革命阶级各革命派别的统一战线。这三件是我们战胜敌人的主要武器。”\n文章提出新中国的国体是“人民民主专政”：在人民内部实行民主，对人民的敌人实行专政，二者结合起来，就是人民民主专政。对人民内部，实行民主集中制——人民有言论集会结社等项的自由权；对反动派，则剥夺其发言权，只许他们规规矩矩。文章还宣布了“一边倒”的外交方针，并强调“严重的问题是教育农民”以及学习经济工作：“我们必须克服困难，我们必须学会自己不懂的东西。我们必须向一切内行的人们（不管什么人）学经济工作。拜他们做老师，恭恭敬敬地学，老老实实地学。不懂就是不懂，不要装懂。”\n这篇文章为三个月后成立的中华人民共和国定下了国体的理论基调，其思想直接体现在《共同纲领》和后来的宪法之中。', quotes: ['总结我们的经验，集中到一点，就是工人阶级（经由共产党）领导的以工农联盟为基础的人民民主专政。', '不懂就是不懂，不要装懂。'] },
        { topic: '《别了，司徒雷登》', meta: '第四卷 · 1949 年 8 月 · 自力更生的宣言', text: '1949 年 8 月，美国国务院发表《美国与中国的关系》白皮书，为对华政策的失败辩护；曾在燕京大学任校长、时任美国驻华大使的司徒雷登黯然回国。毛泽东连写五篇评论予以回击，《别了，司徒雷登》是其中最著名的一篇。\n文章针对白皮书鼓吹的“对华政策失败”论和当时一部分知识分子的亲美幻想，展开了犀利的批驳。它历数美国支持蒋介石打内战的事实——“美国的海陆空军已经在中国参加了战争”，指出美国的白皮书是“一部颠倒历史”的书。文章最有力量的部分，是对封锁的回应：“我们中国人是有骨气的。”“多少一点困难怕什么。封锁吧，封锁十年八年，中国的一切问题都解决了。中国人死都不怕，还怕困难吗？老子说过：‘民不畏死，奈何以死惧之。’”\n文章还写道：“美国确实有科学，有技术，可惜抓在资本家手里，不抓在人民手里，其用处就是对内剥削和压迫，对外侵略和杀人。”并号召：“没有美国就不能活命吗？”——自力更生的精神由此成为新中国的立国宣言。文末以“司徒雷登走了，白皮书来了，很好，很好。这两件事都是值得庆祝的”作结，文笔之凌厉，堪称政论文的典范。', quotes: ['封锁吧，封锁十年八年，中国的一切问题都解决了。中国人死都不怕，还怕困难吗？', '我们中国人是有骨气的。'] },
        { topic: '《不要四面出击》', meta: '第五卷 · 1950 年 6 月 · 新中国初期的施政方针', text: '1950 年 6 月，新中国成立仅九个月。此时大陆尚未完全解放，战争带来的经济困难严重（失业人口大增、通货膨胀、土改尚未完成），民族资产阶级情绪不安，知识分子和各界对新政权还在观望。党的七届三中全会上，毛泽东作《为争取国家财政经济状况的基本好转而斗争》的书面报告，此篇《不要四面出击》是其中的讲话部分。\n讲话提出了一个极其清醒的策略原则：“我们不要四面出击。四面出击，全国紧张，很不好。绝不可树敌太多，必须在一个方面有所让步，有所缓和，集中力量向另一方面进攻。”\n具体而言：对民族资产阶级要有所让步，使工厂照常开工，以恢复经济；对知识分子要团结、教育和改造，而不是急于清算；土改中不动富农的土地财产；对国民党军政人员实行包下来（给饭吃）的政策。总之，缓和各方面矛盾，孤立和打击当前最主要的敌人——旧中国的经济困难和社会动荡。\n这一方针让新政权在极端困难的条件下稳住了阵脚：一年后财政经济状况基本好转，社会秩序安定。它体现的政治智慧——分清主要矛盾与次要矛盾、有所不为才能有所为——至今仍是处理复杂局面时的经典思路，也正是《矛盾论》中“主要矛盾”思想的实战运用。', quotes: ['我们不要四面出击。四面出击，全国紧张，很不好。绝不可树敌太多。', '必须在一个方面有所让步，有所缓和，集中力量向另一方面进攻。'] },
        { topic: '《关于正确处理人民内部矛盾的问题》', meta: '第五卷 · 1957 年 2 月 · 两类矛盾的区分', text: '1956 年社会主义改造基本完成后，大规模的急风暴雨式的阶级斗争基本结束，但工人罢工、学生罢课、农民闹退社等事件接连发生，人民内部矛盾凸显（国际上恰逢苏共二十大批判斯大林与匈牙利事件）。1957 年 2 月 27 日，毛泽东在最高国务会议上发表讲话，系统提出了“两类矛盾”理论。\n文章的核心思想：社会主义社会仍然存在矛盾，但矛盾分为两类——“敌我之间的矛盾是对抗性的矛盾。人民内部的矛盾，在劳动人民之间说来，是非对抗性的”。两类矛盾性质不同，解决方法也不同：敌我矛盾用专政的方法解决；人民内部矛盾只能用民主的方法解决，具体化为一个公式：“团结——批评——团结”。\n文章还提出了著名的“百花齐放、百家争鸣”方针（艺术上百花齐放，学术上百家争鸣），以及“统筹兼顾、适当安排”处理各方面矛盾的思想。文章中“世界是由矛盾组成的，没有矛盾就没有世界”的论断，至今闪耀着辩证法的光芒。\n这篇讲话是毛泽东在建国后最重要的哲学—政治文献，尽管后来的实践一度严重偏离了它的理论，但它提出的区分两类矛盾、正确处理人民内部矛盾的思想，以及以矛盾分析社会的哲学方法，至今仍是中国政治理论的重要遗产。', quotes: ['在人民内部实行民主，对人民的敌人实行专政。', '世界是由矛盾组成的，没有矛盾就没有世界。'] },
        { topic: '《井冈山的斗争》', meta: '第一卷 · 1928 年 11 月 · 工农武装割据的实践报告',
          text: '这篇文章是继《中国的红色政权为什么能够存在？》之后，毛泽东代表红四军前委写给中共中央的报告，它用大量一手材料，详尽记录了井冈山根据地创立一年来的斗争图景：工农革命军由弱到强，边界红色区域扩展到宁冈、永新、莲花全县及吉安、安福、遂川、酃县各一部，土地革命在大部分地区深入开展，乡、区、县各级工农兵政府普遍建立，赤卫队、暴动队遍布乡野。\n文章如实记录了“八月失败”的惨痛教训：湖南省委不顾敌强我弱的实际，强令红军主力冒进湘南，导致边界大部被敌占领，根据地损失惨重。毛泽东从中总结出深刻教训：不顾敌强我弱、不巩固根据地中心区域而远距离冒进，只会招致失败——这个教训反过来印证了“建立中心区域的坚实基础”的极端必要性。\n文章还系统总结了根据地党的建设、政权建设、土地革命和武装斗争的经验，特别指出边界党“几乎完全是农民成分的党”所面临的组织建设难题，并逐一给出解决办法。它和前一篇一起，用活生生的实践材料回答了“红旗到底打得多久”的疑问，把工农武装割据的思想从理论落到了实处。',
          quotes: ['边界的红旗子始终不倒，不但表示了共产党的力量，而且表示了统治阶级的破产。', '红军必须在边界这等地方，下斗争的决心，耐斗争的耐心。'] },
        { topic: '《论反对日本帝国主义的策略》', meta: '第一卷 · 1935 年 12 月 · 瓦窑堡会议与统一战线',
          text: '1935 年 12 月，刚走完两万五千里长征的中共中央在陕北瓦窑堡召开会议。此时的中国正处在历史转折点：日本帝国主义要变中国为它的殖民地，民族矛盾已经超过国内阶级矛盾上升为主要矛盾。毛泽东在会后作了这篇报告，为新的历史阶段定下战略方向。\n报告的核心是建立最广泛的抗日民族统一战线。它分析了国内阶级关系的变化：民族资产阶级有从动摇到参加抗日的可能，甚至地主买办阶级的营垒也会发生分化——“我们要把敌人营垒中间的争论、冲突、缺口，统统收集起来，作为反对当前主要敌人之用”。报告尖锐批评了党内的关门主义，称之为“为渊驱鱼，为丛驱雀”的孤家寡人策略：把可能团结的力量都赶到敌人那边去。\n报告还以雄浑的笔触总结了长征：“长征是历史纪录上的第一次，长征是宣言书，长征是宣传队，长征是播种机。”它向全世界宣告红军是英雄好汉，向十余省两万万人民宣传了红军的道路，散布了革命的种子。这篇文章标志着党的政治策略从“反蒋抗日”转向团结一切的统一战线，是抗日民族统一战线理论的开端。',
          quotes: ['长征是宣言书，长征是宣传队，长征是播种机。', '组织千千万万的民众，调动浩浩荡荡的革命军，是今天的革命向反革命进攻的需要。'] },
        { topic: '《中国革命战争的战略问题》', meta: '第一卷 · 1936 年 12 月 · 十六字诀的系统总结',
          text: '这是毛泽东 1936 年 12 月在陕北红军大学的讲演，原计划系统写完战略学的全部内容，因西安事变爆发只完成了前五章，却已是他军事思想的系统总结。文章开篇即指出：“战争的规律——这是任何指导战争的人不能不研究和不能不解决的问题。”并特别强调：中国革命战争有自己的特点，“不了解中国革命战争的特点，就不能指导中国革命战争”——这是对照搬苏联军事教条的委婉否定。\n文章系统总结了第二次国内革命战争的作战经验，把游击战的精髓概括为十六字诀：“敌进我退，敌驻我扰，敌疲我打，敌退我追。”并深入论述了集中兵力打歼灭战、运动战、速决战等原则，强调“我们的战略是‘以一当十’，我们的战术是‘以十当一’”——集中优势兵力，各个歼灭敌人。\n最有味道的是关于战略退却的论述：诱敌深入、后发制人。“谁人不知，两个拳师放对，聪明的拳师往往退让一步，而蠢人则其势汹汹，辟头就使出全副本领，结果却往往被退让者打倒。”文章还用“丧失土地”的辩证法作结：“只有丧失才能不丧失”，“不在一部分人民家中一时地打碎些坛坛罐罐，就要使全体人民长期地打碎坛坛罐罐”——将欲取之，必先与之的辩证智慧，在这里化成了战争的哲学。',
          quotes: ['敌进我退，敌驻我扰，敌疲我打，敌退我追。', '谁人不知，两个拳师放对，聪明的拳师往往退让一步，而蠢人则其势汹汹，辟头就使出全副本领，结果却往往被退让者打倒。'] },
        { topic: '《〈共产党人〉发刊词》', meta: '第二卷 · 1939 年 10 月 · 三大法宝',
          text: '1939 年 10 月，《共产党人》杂志创刊，毛泽东为其撰写发刊词。此时的党已成立十八年，经历了大革命的胜利与失败、土地革命的十年艰苦、抗日民族统一战线的建立与维护。文章借十八年的完整历史，系统总结了中国革命胜利的基本经验。\n总结的结论浓缩为五个字——三大法宝：“统一战线，武装斗争，党的建设，是中国共产党在中国革命中战胜敌人的三个法宝，三个主要的法宝。”他逐一阐述：统一战线和武装斗争，是战胜敌人的两个基本武器；统一战线，是实行武装斗争的统一战线；武装斗争，是统一战线的中心支柱；而党的组织，则是掌握这两个武器以实行对敌冲锋陷阵的英勇战士。\n文章还把党的建设郑重称为一项“伟大的工程”：“建设一个全国范围的、广大群众性的、思想上政治上组织上完全巩固的布尔什维克化的中国共产党”——在民族战争的环境中实现这项工程，就是这篇文章的历史任务。把党建提到“伟大的工程”的高度，这是党史上的第一次；今天“党的建设新的伟大工程”的说法，源头就在这篇发刊词。',
          quotes: ['统一战线，武装斗争，党的建设，是中国共产党在中国革命中战胜敌人的三个法宝，三个主要的法宝。', '统一战线和武装斗争，是战胜敌人的两个基本武器。'] },
        { topic: '《中国革命和中国共产党》', meta: '第二卷 · 1939 年 12 月 · 认清中国的国情',
          text: '这是一本系统研究中国国情的专著的第一、二章，由毛泽东和其他几位在延安的同志合作完成。第一章“中华民族”用饱含深情的笔墨描绘了这个民族：中国是世界文明发达最早的国家之一，土地广大、人口众多，“中华民族是一个有光荣的革命传统和优秀的历史遗产的民族”——从秦朝的陈胜吴广到清朝的太平天国，中华民族的每一次反抗都写进了历史。\n第二章则冷静地剖析中国社会的性质：自周秦以来，中国一直是封建社会；1840 年鸦片战争之后，在帝国主义列强的侵略下，中国一步一步变成了半殖民地半封建社会。由此得出的结论成为全书的灵魂：“认清中国社会的性质，就是说，认清中国的国情，乃是认清一切革命问题的基本的根据。”\n文章由此推导出中国革命的性质、对象、任务、动力和前途：现时中国的革命是资产阶级民主革命（新民主主义革命），它的对象是帝国主义和封建主义，动力包括无产阶级、农民阶级、城市小资产阶级和民族资产阶级——这套分析框架构成了新民主主义理论的基石，后来在《新民主主义论》中得到完整展开。',
          quotes: ['认清中国社会的性质，就是说，认清中国的国情，乃是认清一切革命问题的基本的根据。', '中华民族是一个有光荣的革命传统和优秀的历史遗产的民族。'] },
        { topic: '《青年运动的方向》', meta: '第二卷 · 1939 年 5 月 · 青年的唯一标准',
          text: '1939 年 5 月 4 日，延安青年群众举行五四运动二十周年纪念大会，毛泽东到会发表演讲，回答了一个大问题：中国青年运动的方向在哪里。\n演讲先分析中国革命的性质和动力，指出辛亥革命失败的教训在于“没有提出反对帝国主义和封建主义的彻底纲领”、没有发动占人口百分之九十的工农大众。他由此给出了判断青年的唯一标准：“看一个青年是不是革命的，拿什么做标准呢？拿什么去辨别他呢？只有一个标准，这就是看他愿意不愿意、并且实行不实行和广大的工农群众结合在一块。愿意并且实行和工农结合的，是革命的，否则就是不革命的，或者是反革命的。”\n演讲还勉励延安青年：“延安的青年们不但本身是团结的，而且和工农群众相结合”，是全国的模范。这篇文章与《纪念白求恩》《为人民服务》一起，构成“老三篇”的经典，每年五四青年节都会被反复重温——它提醒每一代年轻人：青春的价值，在于与谁同行、为谁奋斗。',
          quotes: ['看一个青年是不是革命的……只有一个标准，这就是看他愿意不愿意、并且实行不实行和广大的工农群众结合在一块。', '全国知识青年和学生青年一定要和广大的工农群众结合在一块，和他们变成一体，才能形成一支强有力的军队。'] },
        { topic: '《大量吸收知识分子》', meta: '第二卷 · 1939 年 12 月 · 没有知识分子的参加，革命的胜利是不可能的',
          text: '1939 年 12 月 1 日，毛泽东为中共中央起草了《大量吸收知识分子》的决定。这是一篇只有千余字却极有历史远见的文件。开篇即断言：“在长期的和残酷的民族解放战争中，在建立新中国的伟大斗争中，共产党必须善于吸收知识分子，才能组织伟大的抗战力量，组织千百万农民群众，发展革命的文化运动和发展革命的统一战线。没有知识分子的参加，革命的胜利是不可能的。”\n决定批评了许多部队和地方干部不愿吸收知识分子入党、不敢大胆使用甚至歧视排斥的现象，分析了这种恐惧与排斥心理的错误，并明确规定：一切战区的党和一切党的军队，应该大量吸收知识分子加入军队、加入学校，加以教育，加以使用；对不能入党或不愿入党的知识分子，也应与他们建立良好的共同工作关系，带领他们一道工作。\n决定还预言：“随着革命的发展，知识分子必将大量地涌入我们的队伍。”后来的历史证明了这个判断：从延安走出的知识分子与新中国成立后培养的建设者，构成了国家发展的中坚力量。在知识就是生产力的今天重读这份 1939 年的决定，更能体会其中的远见。',
          quotes: ['没有知识分子的参加，革命的胜利是不可能的。', '共产党必须善于吸收知识分子。'] },
        { topic: '《必须学会做经济工作》', meta: '第三卷 · 1945 年 1 月 · 自力更生的成绩单',
          text: '1945 年 1 月 10 日，毛泽东在陕甘宁边区劳动英雄和模范工作者大会上发表讲话，这就是《必须学会做经济工作》。当时的背景是：国民党停发八路军军饷、对边区实行经济封锁，边区面临极大的经济困难。边区靠什么活下来，还发展壮大了？答案是大生产运动。\n毛泽东在讲话中自豪地列举边区的成绩：“我们的军队既没有因为长期战争而削弱，反而因为战争与生产两重任务而加强了。”三五九旅把南泥湾变成了“陕北的好江南”，机关、学校、部队普遍实现了部分自给甚至全部自给——古今中外的军队史上，这几乎是绝无仅有的事。\n由此他总结出一条根本原则：“我们是主张自力更生的。我们希望有外援，但是我们不能依赖它，我们依靠自己的努力，依靠全体军民的创造力。”同时强调经济工作要“军民兼顾”“公私兼顾”，反对不顾人民生活的“竭泽而渔”。这条自力更生的原则，成为此后几十年新中国建设最重要的精神遗产之一。',
          quotes: ['我们是主张自力更生的。我们希望有外援，但是我们不能依赖它，我们依靠自己的努力，依靠全体军民的创造力。', '一面打仗，一面生产，这是我们的军队的特长。'] },
        { topic: '《论联合政府》', meta: '第三卷 · 1945 年 4 月 · 七大政治报告',
          text: '1945 年 4 月 24 日，中国共产党第七次全国代表大会在延安杨家岭中央大礼堂开幕，毛泽东作《论联合政府》的政治报告。此时抗战胜利在望，中国面临着两种命运的抉择：是建立一个大地主大资产阶级专政的半殖民地半封建国家，还是建立一个工人阶级领导的人民大众的新民主主义国家？\n报告尖锐指出中国面临着两条路线的斗争：“国民党政府压迫中国人民实行消极抗战的路线和中国人民觉醒起来团结起来实行人民战争的路线。”报告据此提出了打败侵略者、建设新中国的完整主张：废止一党专政，成立民主的联合政府；实现人民的自由；实现人民的统一；建立人民的军队。\n报告还系统总结了中国共产党的三大作风：“理论和实践相结合的作风，和人民群众紧密地联系在一起的作风以及自我批评的作风”——这是中国共产党区别于其他任何政党的显著标志。报告以那段沉痛而豪迈的话收束：“成千成万的先烈，为着人民的利益，在我们的前头英勇地牺牲了，让我们高举起他们的旗帜，踏着他们的血迹前进吧！”七大以这次报告为标志，确立了毛泽东思想作为党的指导思想。',
          quotes: ['理论和实践相结合的作风，和人民群众紧密地联系在一起的作风以及自我批评的作风，是中国共产党区别于其他任何政党的显著标志。', '成千成万的先烈，为着人民的利益，在我们的前头英勇地牺牲了，让我们高举起他们的旗帜，踏着他们的血迹前进吧！'] },
        { topic: '《建立巩固的东北根据地》', meta: '第四卷 · 1945 年 12 月 · 让开大路，占领两厢',
          text: '抗战胜利后，东北成为国共双方争夺的焦点：东北有当时中国最发达的重工业、广大的产粮区，背靠苏联，连接华北。中共中央迅速作出“向北发展，向南防御”的战略决策，抽调两万名干部、十余万部队日夜兼程挺进东北。1945 年 12 月 28 日，毛泽东为中共中央起草了给东北局的这份指示。\n指示清醒地分析了东北的形势：国民党在美国的帮助下将争夺东北的大城市和交通干线，我党在东北的力量将处于“敌占中心城市的四面受敌”的境地。因此，党的方针不应该是占据大城市和交通干线，而应该是“让开大路，占领两厢”——把工作重心放在距离国民党占领中心较远的城市和广大乡村，发动群众、清剿土匪、进行土地改革、建立政权和武装。\n指示特别强调“做长期打算”：东北的斗争是艰苦的，必须建立巩固的军事政治的根据地，才能“将大军立于不败之地”。这份指示的战略眼光很快被历史验证：一年多后的辽沈战役，正是从这些“两厢”的根据地出发，完成了对东北全境的解放。',
          quotes: ['我党现时在东北的任务，是建立根据地。', '让开大路，占领两厢。'] },
        { topic: '《将革命进行到底》', meta: '第四卷 · 1949 年 新年献词',
          text: '1948 年底，人民解放军已在辽沈、淮海、平津三大战役中取得决定性胜利，国民党反动统治摇摇欲坠。此时，美国支持者和国民党内的一部分人开始鼓吹“和平”，企图以“划江而治”保住半壁江山。1948 年 12 月 30 日，毛泽东为新华社写下了这篇 1949 年新年献词。\n文章开篇提出了一个尖锐的问题：是将革命进行到底，还是使革命半途而废？“如果要使革命进行到底，那就是用革命的方法，坚决彻底干净全部地消灭一切反动势力，不动摇地坚持打倒帝国主义，打倒封建主义，打倒官僚资本主义，在全国范围内推翻国民党的反动统治……而决不允许半途而废。”文章揭露了美蒋的“和平”阴谋是“争取喘息时间”的缓兵之计，并号召人民绝不能怜悯蛇一样的恶人。\n文章充满信心地展望 1949 年：中国人民解放军将向长江以南进军；将召开没有反动分子参加的、以完成人民革命任务为目标的政治协商会议；将宣告中华人民共和国的成立。“几千年以来的封建压迫，一百年以来的帝国主义压迫，将在我们的奋斗中彻底地推翻掉。”这篇献词里的每一个字，都在这一年变成了现实。',
          quotes: ['坚决彻底干净全部地消灭一切反动势力，不动摇地坚持打倒帝国主义，打倒封建主义，打倒官僚资本主义。', '几千年以来的封建压迫，一百年以来的帝国主义压迫，将在我们的奋斗中彻底地推翻掉。'] },
        { topic: '《党委会的工作方法》', meta: '第四卷 · 1949 年 3 月 · 学会“弹钢琴”',
          text: '1949 年 3 月 13 日，中共七届二中全会闭幕。毛泽东作总结讲话，其中一部分专门讲了“党委会的工作方法”——十二条方法，每一条都朴实得像老农的经验谈，却蕴含着深刻的领导科学。\n十二条包括：一、党委书记要善于当“班长”，把委员会这班人带好；二、要把问题摆到桌面上来，不要在背后议论；三、“互通情报”，各委员会之间要彼此知道情况；四、不懂得和不了解的东西要问下级，不要轻易表示赞成或反对；五、学会“弹钢琴”——“一个党委要抓紧中心工作，又要围绕中心工作而同时开展其他方面的工作”，十个指头的动作要有节奏、互相配合；六、要“抓紧”，“什么东西只有抓得很紧，毫不放松，才能抓住”；七、胸中有“数”——对情况和问题一定要注意到它们的数量方面，要有基本的数量的分析，“任何质量都表现为一定的数量，没有数量也就没有质量”。\n其余五条同样精到：开会要事先通知，像出“安民告示”一样；“精兵简政”，讲话、演说、写文章和写决议案，都应当简明扼要；注意团结那些和自己意见不同的同志一道工作；力戒骄傲；划清两种界限——革命和反革命的界限、成绩和缺点的界限。十二条中随手拈出一条，今天的管理者依然可以受用终身——这大概就是它被反复印刷、代代相传的原因。',
          quotes: ['学会“弹钢琴”。', '胸中有“数”。对情况和问题一定要注意到它们的数量方面，要有基本的数量的分析。'] },
        { topic: '《唯心历史观的破产》', meta: '第四卷 · 1949 年 9 月 · 人是第一个可宝贵的',
          text: '1949 年 8 月，美国国务卿艾奇逊在《美国与中国的关系》白皮书里，对中国革命给出了一种解释：中国革命的发生是因为人口过多、土地不堪负担，加上西方“新思想”的输入引起了“骚动”。毛泽东在《唯心历史观的破产》中对此逐一批驳，文风幽默而犀利。\n对于人口论，文章反问：“革命的发生是由于人口太多的缘故么？古今中外有过很多的革命，都是由于人口太多么？”美国一百多年前的独立战争不是因人口，俄国的十月革命也不是；中国几千年历史上的无数次起义同样如此。真正的原因是剥削与压迫。文章还豪迈地宣告：“中国人口众多是一件极大的好事。再增加多少倍人口也完全有办法，这个办法就是生产。”“世间一切事物中，人是第一个可宝贵的。在共产党领导下，只要有了人，什么人间奇迹也可以造出来。”\n对于“新思想输入”论，文章指出：不是思想输入引起革命，而是压迫引起反抗；而使中国人获得思想武器的，正是马克思列宁主义。“马克思列宁主义来到中国之所以发生这样大的作用，是因为中国的社会条件有了这种需要，是因为同中国人民革命的实践发生了联系，是因为被中国人民所掌握了。”文章宣告：自从中国人学会了马克思列宁主义以后，中国人在精神上就由被动转入主动。',
          quotes: ['世间一切事物中，人是第一个可宝贵的。在共产党领导下，只要有了人，什么人间奇迹也可以造出来。', '自从中国人学会了马克思列宁主义以后，中国人在精神上就由被动转入主动。'] },
        { topic: '《关于农业合作化问题》', meta: '第五卷 · 1955 年 7 月 · “小脚女人”',
          text: '1955 年上半年，农业合作化运动的速度之争在党内展开：一些同志认为发展太快了，主张收缩、放慢。7 月 31 日，毛泽东在省委、市委和区党委书记会议上作《关于农业合作化问题》的报告，对此提出了批评。',
          quotes: ['我们的某些同志却像一个小脚女人，东摇西摆地在那里走路，老是埋怨旁人说：走快了，走快了。', '大多数农民有一种走社会主义道路的积极性。'] },
        { topic: '《论十大关系》', meta: '第五卷 · 1956 年 4 月 · 以苏为鉴的探索',
          text: '1956 年 4 月 25 日，毛泽东在中央政治局扩大会议上发表《论十大关系》的讲话。此时的中国，社会主义改造基本完成，大规模建设即将展开。而苏联模式的弊端已经开始暴露——“最近苏联方面暴露了他们在建设社会主义过程中的一些缺点和错误，他们走过的弯路，你还想走？”讲话的基本方针由此提出：“我们要调动一切直接的和间接的力量，为把我国建设成为一个强大的社会主义国家而奋斗。”\n讲话围绕十对关系展开：重工业和轻工业、农业的关系；沿海工业和内地工业的关系；经济建设和国防建设的关系；国家、生产单位和生产者个人的关系；中央和地方的关系——以上五条是经济关系；汉族和少数民族的关系；党和非党的关系；革命和反革命的关系；是非关系；中国和外国的关系——这五条是政治关系。其中“又要重工业，又要人民”的平衡思想、向一切国家学习的开放态度（“我们的方针是，一切民族、一切国家的长处都要学，政治、经济、科学、技术、文学、艺术的一切真正好的东西都要学”），都展现出不同于苏联模式的探索。\n《论十大关系》标志着中国人开始“以苏为鉴”，独立探索适合中国情况的社会主义建设道路。它对计划经济体制内中央与地方关系的反思（“应当在巩固中央统一领导的前提下，扩大一点地方的权力”）、对农轻重比例的强调，在此后几十年的经济改革中都能听到回声。可以说，改革开放的很多思想种子，最早就埋在这篇讲话里。',
          quotes: ['调动一切积极因素，为社会主义事业服务。', '我们的方针是，一切民族、一切国家的长处都要学，政治、经济、科学、技术、文学、艺术的一切真正好的东西都要学。'] },
        { topic: '《人的正确思想是从哪里来的？》', meta: '第五卷 · 1963 年 5 月 · 两个飞跃',
          text: '1963 年 5 月，毛泽东为修改《中共中央关于目前农村工作中若干问题的决定（草案）》写了一段话，后来单独成篇，就是《人的正确思想是从哪里来的？》。全文只有五百多字，却把《实践论》的思想浓缩成了人人能懂的三个问题。\n文章开头就是石破天惊的三连问：“人的正确思想是从哪里来的？是从天上掉下来的吗？不是。是自己头脑里固有的吗？不是。”那么答案是什么？“人的正确思想，只能从社会实践中来，只能从社会的生产斗争、阶级斗争和科学实验这三项实践中来。”\n文章进而指出认识的两个飞跃：第一步，客观外界的现象通过人的眼、耳、鼻、舌、身反映到头脑中来，形成感性认识，再上升为理性思想——这是“物质变精神”；第二步，把思想付诸实践，看它能否达到预想的目的——这是“精神变物质”。而“一个正确的认识，往往需要经过由物质到精神，由精神到物质，即由实践到认识，由认识到实践这样多次的反复，才能够完成”。短短五百字，是“两论”思想的通俗化终章，也是后来“实践是检验真理的唯一标准”大讨论的思想源头。',
          quotes: ['人的正确思想，只能从社会实践中来，只能从社会的生产斗争、阶级斗争和科学实验这三项实践中来。', '物质可以变成精神，精神可以变成物质。'] }
      ];
      (function () {
        var d = new Date();
        var day = Math.floor(d.setHours(0, 0, 0, 0) / 86400000);
        var today = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
        var cur = day % MAO_POOL.length;
        var paras = [], maoTotal = 1, maoCur = 0;

        function maoShow() {
          var start = maoCur * 2;
          document.getElementById('maoText').textContent = paras.slice(start, start + 2).join('\n\n');
          document.getElementById('maoPage').textContent = '第 ' + (maoCur + 1) + ' / ' + maoTotal + ' 页';
          document.getElementById('maoPrev').disabled = maoCur === 0;
          document.getElementById('maoNext').disabled = maoCur >= maoTotal - 1;
        }

        function renderMao(idx) {
          cur = ((idx % MAO_POOL.length) + MAO_POOL.length) % MAO_POOL.length;
          var a = MAO_POOL[cur];
          document.getElementById('maoDate').textContent = '第 ' + (cur + 1) + ' / ' + MAO_POOL.length + ' 篇 · ' + today;
          document.getElementById('maoTopic').textContent = a.topic;
          document.getElementById('maoMeta').textContent = a.meta;
          paras = a.text.split('\n\n');
          maoTotal = Math.max(1, Math.ceil(paras.length / 2));
          maoCur = 0;
          document.getElementById('maoQuotes').innerHTML = a.quotes.map(function (s) { return '<li></li>'; }).join('');
          var els = document.getElementById('maoQuotes').querySelectorAll('li');
          for (var i = 0; i < els.length; i++) { els[i].textContent = a.quotes[i]; }
          maoShow();
          if (typeof maoTocHi === 'function') { maoTocHi(); }
        }
        var maoTocEl = document.getElementById('maoToc');
        MAO_POOL.forEach(function (p, i) {
          var li = document.createElement('li');
          var b = document.createElement('button');
          b.type = 'button';
          b.textContent = (i + 1) + '. ' + p.topic;

          b.addEventListener('click', function () { renderMao(i); });

        function maoTocHi() {

          for (var i = 0; i < btns.length; i++) { btns[i].className = (i === cur) ? 'active' : ''; }
        }
        maoTocHi();
        renderMao(cur);
        // 篇内分页：每页 2 段
        document.getElementById('maoPrev').addEventListener('click', function () { if (maoCur > 0) { maoCur--; maoShow(); } });
        document.getElementById('maoNext').addEventListener('click', function () { if (maoCur < maoTotal - 1) { maoCur++; maoShow(); } });
        // 下一篇：跳到下一篇目（循环），从第 1 页开始
        document.getElementById('maoNextArticle').addEventListener('click', function () { renderMao(cur + 1); });
      })();
    </script>
    
</main>
</div>

</body>
</html>
