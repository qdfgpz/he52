    <script>
      /* ===== 情报站实时刷新：调用后端 /api/news 接口 ===== */
      (function () {
        var btn = document.getElementById('hubRefreshBtn');
        var statusEl = document.getElementById('hubStatus');
        var emptyMsg = {
          ai: '今日重磅还没送到，先用下面渠道直达～',
          nba: '今天没有新战报（可能休赛日），点下面渠道看最新动态',
          thu: '今天暂无新发布，点下面渠道看最新进展',
          csgo: '今日重磅还没送到，先用下面渠道直达～'
        };
        var failMsg = '这个源暂时拉取失败，稍后再点一次试试';

        function renderBox(k, items, failed) {
          var el = document.getElementById('live-' + k);
          if (!el) return;
          el.innerHTML = '<li class="hub-live-title">⚡ 今日要闻</li>';
          if (items && items.length) {
            el.insertAdjacentHTML('beforeend', items.map(function () {
              return '<li><a target="_blank" rel="noopener noreferrer"></a></li>';
            }).join(''));
            var as = el.querySelectorAll('a');
            for (var i = 0; i < as.length; i++) { as[i].href = items[i].u; as[i].textContent = items[i].t; }
          } else {
            var li = document.createElement('li');
            li.className = 'hub-stale';
            li.textContent = failed ? failMsg : emptyMsg[k];
            el.appendChild(li);
          }
        }

        function refreshAll() {
          btn.disabled = true;
          statusEl.textContent = '实时拉取中…';
          fetch('/api/news').then(function (r) { return r.json(); }).then(function (d) {
            ['ai', 'nba', 'thu', 'csgo'].forEach(function (k) {
              renderBox(k, d[k] || [], (d.failed || []).indexOf(k) >= 0);
            });
            statusEl.textContent = '已实时更新 ' + d.updated;
            try { localStorage.setItem('hubRealtime', JSON.stringify({ date: d.date, time: d.updated, data: d })); } catch (e) {}
            btn.disabled = false;
          }).catch(function () {
            statusEl.textContent = '后端未启动？请先运行 python main.py';
            btn.disabled = false;
          });
        }

        function todayStr() {
          var d = new Date();
          return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
        }

        try {
          var cached = JSON.parse(localStorage.getItem('hubRealtime'));
          if (cached && cached.date === todayStr() && cached.data) {
            Object.keys(cached.data).forEach(function (k) { renderBox(k, cached.data[k], false); });
            statusEl.textContent = '已实时更新 ' + cached.time;
          }
        } catch (e) {}

        btn.addEventListener('click', refreshAll);
      })();
    </script>

          text: '公元前 5 世纪的雅典，一群自称“智者”的人收费教人雄辩，苏格拉底是唯一的例外：赤脚、旧袍、不收钱，还主动在集市上找人辩论。他的方法后来被称为“苏格拉底反诘”（elenchus）：先请对方给“勇敢”“正义”下定义，再举出反例让对方修正，几轮下来，自以为有智慧的人往往当众发现自己其实说不清。德尔斐神谕曾宣布“没有人比苏格拉底更有智慧”，他想了很久才明白：别人不懂却自以为懂，而他至少知道自己不懂——这就是“无知之知”。公元前 399 年，他被公民大会以“败坏青年、不敬神明”的罪名判处死刑，他拒绝越狱，当众饮下毒芹汁。柏拉图在《苏格拉底的申辩》里记下了他的自我辩护，其中那句“未经审视的人生不值得过”，至今仍是哲学对每个人的邀请。',

          book: '柏拉图《苏格拉底的申辩》', bookSearch: '苏格拉底的申辩 柏拉图' },
        { topic: '柏拉图洞穴寓言：走出影子的人', school: '古希腊 · 柏拉图（前427—前347）', kw: '柏拉图 洞穴寓言',
          text: '《理想国》第七卷开头，柏拉图请读者做一场思想实验：一群囚徒从小被锁在洞穴里，只能面壁而坐；身后燃着火，有人举着木偶和器物走过矮墙，火光把影子投在墙上。囚徒一生看到的只有影子、听到的只有回声，于是把影子的“名字”和“规律”当作全部知识。某天一个囚徒挣脱枷锁，转身先被火光刺痛双眼，再被拉出洞口，在阳光下眩晕流泪，最后才看清：万物靠太阳照亮，而太阳对应着最高的理念“善”。柏拉图由此说明：我们感知的世界只是“理念世界”的投影，教育也不是把知识灌进空脑袋，而是让灵魂完成一次“转向”。最悲凉的是结尾——被解放者回到洞里讲述真相，囚徒们不但不信，还想杀掉他。据说，这暗指的正是苏格拉底之死。',
          q: '如果告诉你某个深信多年的“常识”只是墙上的影子，你会回头看一眼阳光，还是回到座位上？',

        { topic: '亚里士多德：幸福是把潜能活出来', school: '古希腊 · 亚里士多德（前384—前322）', kw: '亚里士多德 幸福',
          text: '《尼各马可伦理学》开篇就问：一切行为是否都指向某个“善”？钱为了买东西，健康为了享受生活，层层向上，总有一个“最终目的”不再是为了别的什么——亚里士多德称之为 eudaimonia，通常译作“幸福”，直译更像“灵魂活得好”。他的“功能论证”是：笛子的功能是演奏，眼睛的功能是看，而人区别于草木禽兽的特有功能是理性，所以人的善，就是把理性潜能卓越地实现出来。这种卓越叫德性（aretê），它不靠天赋灌输，而是练出来的——“我们通过做公正的事成为公正的人”。他还提出“中道”原则：勇敢是鲁莽与怯懦之间的恰当中点，慷慨是挥霍与吝啬之间。在全书末尾他把生活分为享乐、从政与沉思三种，最高的仍是沉思——那是最接近神性、最少依赖他人的自足活动。',
          q: '你最近做的事里，哪些是手段，哪些本身就是你想要的“实现”？',
          book: '亚里士多德《尼各马可伦理学》', bookSearch: '尼各马可伦理学 亚里士多德' },
        { topic: '伊壁鸠鲁：快乐是痛苦的缺席', school: '古希腊 · 伊壁鸠鲁（前341—前270）', kw: '伊壁鸠鲁 快乐',
          text: '伊壁鸠鲁在雅典城郊买下一座花园办学，女性和奴隶也能进来，这在当时惊世骇俗。世人骂他纵欲，其实他把快乐定义为“痛苦的缺席”：身体的无痛（aponia）加上心灵的宁静（ataraxia），就已经是快乐的上限，再多的盛宴只是换一种方式受罪。他把欲望分三类：自然且必要的（食物、住处、友谊），自然但不必要的（山珍海味），既不自然也不必要的（权力、名声）——只满足第一类，人生就足够好，因为奢侈的欲望只会制造新的痛苦。对死亡的恐惧是最深的枷锁，他的解药是一个对称论证：“死亡与我们无关——我们活着时，死亡不在场；死亡来临时，我们已不在。”他的花园学派延续数百年，哲学史家评价他：是把哲学当作止痛药的第一人。',
          q: '你现在追逐的东西，是在消除痛苦，还是在制造新的欲望？',
          book: '伊壁鸠鲁《致美诺寇的信》', bookSearch: '致美诺寇的信 伊壁鸠鲁' },
        { topic: '斯多葛控制二分法', school: '古希腊 · 爱比克泰德（约50—135）', kw: '斯多葛 控制二分',
          text: '爱比克泰德生来是奴隶，据说腿被主人拧断，获释后在罗马开课，连贵族都来听课，学生阿利安把他的谈话整理成《手册》与《谈话录》。开篇第一条就是控制二分法：“有些事取决于我们——判断、冲动、欲望、行动；有些事不完全取决于我们——身体、财产、名声、官职。”痛苦来自把两类搞混：为天气和别人的看法焦虑，却放任自己唯一的财产——判断力——荒废。由此派生出斯多葛的日常功课：负面想象（premeditatio malorum，提前预想失去一切，既珍惜当下又不执着）；目标与结果的分离（你该做的是全力瞄准，箭中不中交还给命运——事物本身没有对错，对错来自你对它的判断）。这套心灵体操两千多年后在认知行为疗法（CBT）里转世重生，近年还掀起了一场“斯多葛复兴”。',
          q: '列出你今天焦虑的三件事：它们真的在你的控制范围内吗？',
          book: '爱比克泰德《手册》', bookSearch: '手册 爱比克泰德' },
        { topic: '笛卡尔：我思，故我在', school: '近代 · 笛卡尔（1596—1650）', kw: '笛卡尔 我思故我在',
          text: '1637 年，笛卡尔用法语而非学术拉丁语出版《谈谈方法》，让不识拉丁文的普通人第一次能读到哲学。书中他回顾自己受过当时最完备的教育，却发现几乎没有一件事是确定的，于是决定亲手重建知识大厦：凡可怀疑的，一律当作假的扔掉。第一步，感官会骗人——远处的方塔看着是圆的；第二步，梦境与清醒无法绝对区分；第三步，设想一个全能的恶魔专门在欺骗我——整座知识大厦似乎塌了。但就在这里他踩到一块磐石：无论恶魔怎么骗，“我正在被欺骗”意味着“我正在思考”，而正在思考的我必然存在——“我思，故我在”。笛卡尔强调这不是三段论推理，而是理性对单个事实的直接直觉。由此他定下“凡清楚明白地知觉到的皆为真”的新规则，整个近代哲学从这块磐石上重新开工——尽管立刻引出了新难题：不相互作用的心灵与身体，怎么解释“我抬手，手就抬起来”？',
          q: '你还能找到一个比“我正在思考”更不可能被怀疑的事实吗？',
          book: '笛卡尔《谈谈方法》', bookSearch: '谈谈方法 笛卡尔' },
        { topic: '帕斯卡赌注：信仰的期望值', school: '近代 · 帕斯卡（1623—1662）', kw: '帕斯卡 赌注',
          text: '帕斯卡是数学神童：16 岁证明几何定理，19 岁发明机械计算器，与费马的通信直接奠定了概率论。1654 年 11 月 23 日夜，他经历一场神秘的宗教狂喜，把“火”字缝进衣襟，余生转向信仰辩护。身后出版的《思想录》是未完成的碎片集，最著名的段落是“赌注”：上帝存在与否，理性无法裁决，那就按概率算账——若上帝存在，信者得无限幸福，不信者受无限损失；若不存在，信与不信的得失皆有限。期望值一比，押“存在”完胜。他还留下一句转向内心的名言：“心有其理，为理性所不识。”批评者也毫不客气：信仰岂能当赌注？若真有别的神呢（诸神难题）？如果上帝只奖励真诚的信徒，算计出来的“信”还算信仰吗？这些追问让赌注成为决策论在宗教哲学的开山实验场。',
          q: '用期望值决定人生大事，你觉得哪里对、哪里不对劲？',
          book: '帕斯卡《思想录》', bookSearch: '思想录 帕斯卡' },
        { topic: '休谟：归纳的深渊', school: '英国经验论 · 休谟（1711—1776）', kw: '休谟 归纳',
          text: '休谟 26 岁写完《人性论》，后来自嘲它“一从印刷机上生下来就死了”——没人读。他改写成更轻快的《人类理解研究》（1748），其中第四节埋下了哲学史上最著名的炸弹之一：归纳问题。我们的知识大多靠归纳：太阳过去每天都升起，所以明天也会升起。但请细看这个推理——“过去有效”推不出“未来必然有效”，而这个过渡的正当性恰恰要靠归纳本身来担保：循环论证了。休谟的结论惊人地坦率：理性在此无能为力，我们靠的不是逻辑而是“习惯”——反复的联结让期待生根，“习惯是人生的伟大指南”。此后两百年，康德说休谟把他从独断的迷梦中唤醒，罗素坦承归纳无解，波普尔用“证伪主义”绕开它，贝叶斯学派用概率重新表述——但没有谁宣布真正解决了它。',
          q: '一个从没见过黑天鹅的人，凭什么断言天鹅都是白的？',
          book: '休谟《人类理解研究》', bookSearch: '人类理解研究 休谟' },
        { topic: '康德：绝对命令', school: '德国观念论 · 康德（1724—1804）', kw: '康德 绝对命令',
          text: '康德一辈子几乎没离开过哥尼斯堡，散步准时到邻居拿他校对钟表。他说休谟“把我从独断的迷梦中唤醒”，《道德形而上学奠基》（1785）就是回应。他划出道德哲学史上最锋利的一条线：假言命令是“如果想要 X，就该做 Y”，永远有条件；而道德要求必须无条件，即绝对命令（kategorischer Imperativ）。第一个公式是普遍化检验：只按你愿意其成为普遍法则的准则行动。康德举了四例逐一检验——自杀（人人自毁则生命无法延续）、虚假承诺（人人撒谎则承诺失效）、埋没才能、见死不救。第二个公式同样有名：永远同时把人当作目的，绝不仅仅当作手段。第三个是自律：道德法则不是神、情感或习俗从外部颁给的，而是理性自我立法。批评也从不缺席：完全不看结果的道德，会不会沦为空洞的形式主义？善意的谎言如果真能救人呢？',
          q: '你正在做（或想做）的事，敢不敢让它成为全世界的普遍规则？',
          book: '康德《道德形而上学奠基》', bookSearch: '道德形而上学奠基 康德' },
        { topic: '功利主义：最大多数人的最大幸福', school: '英国经验论 · 边沁 & 密尔', kw: '功利主义 哲学',
          text: '边沁在《道德与立法原理导论》（1789）开篇宣布：“自然把人类置于两位主权者——快乐与痛苦——的统治之下。”功利原则由此登场：行为的对错，取决于它增减相关者幸福总量的多少。边沁甚至设计了“幸福微积分”，按强度、持续、确定、远近、繁殖、纯粹、广延七个维度给快乐打分。批评者讥讽这是“适合猪的哲学”，他的学生兼教子密尔在《功利主义》（1861）里回应：快乐有质的高低——“做一个不满足的人，胜过做一头满足的猪；做不满足的苏格拉底，胜过做一个满足的傻瓜”，体验过两种快乐的人自会偏爱高级的那种。这对师徒开创的传统，至今是公共政策的隐形标尺：成本收益分析、医疗资源分配、拥堵费定价，背后都是功利计算。最痛的问题也留在原处：少数人的牺牲，真能被总量正义抵消吗？',
          q: '如果牺牲一个人能让一万人幸福，总量算下来是正的，你按按钮吗？',
          book: '密尔《功利主义》', bookSearch: '功利主义 密尔' },
        { topic: '尼采：上帝死了之后', school: '德国 · 尼采（1844—1900）', kw: '尼采 哲学',
          text: '“上帝死了”这句话，尼采在《快乐的科学》§125 里让它由一个疯子在大白天提着灯笼喊出来：“我寻找上帝！我寻找上帝！”人群哄笑，疯子却说：是我们杀了他——而我们还没准备好承担这件事。意思是：支撑西方两千年的超验价值体系（彼岸、天国、绝对真理）崩塌了，人正悬在虚无的深渊上，却浑然不觉。《查拉图斯特拉如是说》（1883—1885）是他的回应：不再逃向彼岸，而是在此岸自己创造价值——成为“超人”；与之对照的“末人”，只求舒适、娱乐和“没有人比别人更聪明”的安全。他还抛出一个可怕的思想实验——永恒轮回：若此生将原样无限重复，你敢不敢？1889 年 1 月，他在都灵街头抱住一匹正被鞭打的马，从此精神崩溃，十一年后去世。可惜死后手稿被妹妹按纳粹口味篡改，“法西斯思想家”的误解一背就是几十年。',
          q: '如果没有任何外在标准为你兜底，你会给自己立一条什么法则？',
          book: '尼采《查拉图斯特拉如是说》', bookSearch: '查拉图斯特拉如是说 尼采',
          fixedVideo: { t: '【刘擎】空虚、无聊、没意思，感到虚无的时候，不妨看看尼采吧！', u: 'https://www.bilibili.com/video/BV1w44y1Q7cq' } },
        { topic: '萨特：存在先于本质', school: '法国存在主义 · 萨特（1905—1980）', kw: '萨特 存在主义',
          text: '1945 年 10 月，萨特在巴黎“现在俱乐部”演讲，场内外挤满了人，有人被挤晕——存在主义一夜之间从课堂走进了咖啡馆，《存在主义是一种人道主义》就是这篇演讲的成文。核心命题是“存在先于本质”：裁纸刀是先有设计图（本质）再被造出来，人却相反——先被抛到世界上，没有预装的人性模板，然后才通过一次次选择把自己造就成现在的样子。既然没有上帝替你定规矩，也就没有借口可找：怕见心上人而躲去朋友家，是“自欺”（mauvaise foi）；咖啡馆侍者把自己演得像个家具，也是自欺。更沉重的是“人被判处自由”：站在悬崖边的眩晕不是怕掉下去，而是意识到没有任何东西拦着你跳——自由是人逃不掉的判决，而你的每一次选择，你都在为全人类示范。',
          q: '把你至今的选择都算作“自我设计”，你对现在这版自己满意吗？',
          book: '萨特《存在主义是一种人道主义》', bookSearch: '存在主义是一种人道主义 萨特' },
        { topic: '加缪：应该设想，西西弗是幸福的', school: '法国 · 加缪（1913—1960）', kw: '加缪 西西弗',
          text: '《西西弗神话》（1942）第一句话就是哲学史上最著名的开场之一：“真正严肃的哲学问题只有一个：自杀。”加缪说，人渴望意义、统一和明晰，世界却用冷漠和混沌回应——这个落差就是“荒诞”。注意，荒诞不在人，也不在世界，而在两者的相遇。面对荒诞有三种反应：肉体自杀（承认被打败）、哲学性自杀（跳进宗教或意识形态买现成意义）、或者——反抗。他选第三条：不指望终点，全力活在此刻。全书以希腊神话收尾：西西弗因触怒诸神被罚永远推石上山，石到山顶必然滚落。加缪却说，下山途中的西西弗高于他的命运——“应该设想，西西弗是幸福的”。1952 年他与萨特因《反抗者》公开决裂，1957 年获诺贝尔文学奖，1960 年死于车祸，年仅 46 岁——口袋里还装着没用上的火车票。',
          q: '你生活里那块“巨石”是什么？如果注定推不完，你还愿意推吗？',
          book: '加缪《西西弗神话》', bookSearch: '西西弗神话 加缪' },
        { topic: '忒修斯之船：换完所有木板还是那条船吗', school: '形而上学 · 古典难题', kw: '忒修斯之船',
          text: '普鲁塔克在《忒修斯传》里记下这个古老的问题：雅典人保存着忒修斯当年驶回的那条船，木板朽坏一块就换一块新的，如此数百年，哲学家们便争论——它还是原来那条船吗？霍布斯在十七世纪补了致命一刀：假如有人把换下来的旧木板全部收好，最后照原样重新拼出一条船，两条船哪条才有资格叫“忒修斯之船”？这逼出三种立场：同一性在物质（旧板船）、在形式与连续功能（维修船）、或者在无可替代的历史。帕菲特在《理与人》（1984）里说得更狠：也许“同一性”根本是个空概念，真正重要的只是心理关联的程度——他甚至设想“分裂传送机”让你和副本同时存在。这个问题今天活得好好的：你的细胞七年全部更换，器官移植者换了心脏，被收购重组的公司还是“同一家公司”吗？',
          q: '如果记忆和性格全部更新一遍，“你”凭什么还是你？',
          book: '普鲁塔克《希腊罗马名人传·忒修斯传》', bookSearch: '忒修斯之船' },
        { topic: '电车难题：拉杆与推人的直觉裂缝', school: '伦理学 · 富特 / 汤姆森（1967—）', kw: '电车难题 哲学',
          text: '1967 年，牛津哲学家菲利帕·富特在讨论堕胎的论文里，顺手续了一个小例子：失控电车将压死五人，你可以扳动道岔让它转向只绑着一个人的岔道。就这么个“脚注”，长成了二十世纪最著名的思想实验。1976 年朱迪斯·汤姆森加码：天桥上站着一个大胖子，把他推下去可以挡住电车救五个人。调查反复显示：多数人愿意拉杆，却拒绝推人——可两者都是“牺牲一个救五个”。流行的解释诉诸“双重效果”原则（源于阿奎那）：可预见的坏结果若只是副作用可以接受，故意把人当工具则不行；格林的脑成像实验则发现，“亲手推人”激活了更强烈的情绪脑区。这个问题早已走出课堂：自动驾驶该先保护谁、疫情下呼吸机怎么分配，本质都是电车难题的现实版。',
          q: '拉杆和推人，你觉得差别在哪？这个差别重要吗？',
          book: '桑德尔《公正：该如何做是好？》', bookSearch: '公正 该如何做是好 桑德尔' },
        { topic: '缸中之脑：黑客帝国的哲学原型', school: '知识论 · 普特南（1981）', kw: '缸中之脑',
          text: '《理性、真理与历史》（1981）第一章，普特南抛出现代版怀疑：设想一个大脑被取出泡在营养缸里，超级计算机向它输入与常人完全相同的电信号——它体验到的“人生”毫无破绽，就像《黑客帝国》里浸泡在培养舱中的尼奥。笛卡尔用“恶魔”表达过同款怀疑，普特南却给出一个出人意料的论证：根据他的语义因果论，词的指称取决于使用者与对象的因果历史——一个真正的缸中之脑从未接触过真实的缸和脑，它说的“缸”“脑”只能指向虚拟世界里的图像；因此当它说“我是缸中之脑”时，按它自己的语言这句话是假的。换言之，“我是缸中之脑”这个假设自我拆台，永远说不通。论证精巧却争议巨大——它至少证明了一件事：怀疑论想自圆其说，比想象中难得多。',
          q: '如果一个虚拟世界毫无破绽且体验真实，“真实”这个词还剩下什么意思？',
          book: '普特南《理性、真理与历史》', bookSearch: '理性真理与历史 普特南' },
        { topic: '图灵测试：机器能思考吗', school: '心灵哲学 · 图灵（1950）', kw: '图灵测试',
          text: '1950 年，图灵在哲学期刊《心灵》上发表《计算机器与智能》，开头就说：“我提议考虑这个问题：机器能思考吗？”但他立刻承认“思考”无法定义，于是换掉牌桌——提出“模仿游戏”：判定者隔着文字与人和机器分别对话，如果分不清谁是谁，就承认机器在“思考”。他甚至给出预测：“到 2000 年，普通提问者在五分钟内误判的概率将超过 70%。”论文后半部分逐一回应了九类反对意见——神学（上帝只把灵魂给了人）、意识（“机器没有自我感觉”）、“拉夫莱斯伯爵夫人异议”（机器永远不会原创）等等。此后的历史像在逐条完成他的预言：1966 年只会套话的 ELIZA 让用户坚信她懂自己，深蓝、AlphaGo 相继登顶，而大语言模型让“图灵测试还够不够用”重新成为热点。',
          q: '如果一台机器的所有外在表现都和人一样，你坚持“它没有心灵”的理由是什么？',
          book: '图灵《计算机器与智能》（1950）', bookSearch: '计算机器与智能 图灵' },
        { topic: '中文房间：符号操作等于理解吗', school: '心灵哲学 · 塞尔（1980）', kw: '中文房间',
          text: '1980 年，塞尔在《行为与脑科学》发表论文，随刊附上二十多位学者的回应，战火至今未熄。思想实验是这样的：一个只懂英语的人被锁在房间里，桌上有一本英文规则书；窗外递进写着中文问题的纸条，他按规则查找符号、组合出中文回答递出去——屋里人完全不懂中文，但外面收到的回复无懈可击。塞尔的结论是：这反驳了“强人工智能”——计算机无论多流畅，都只是在操作句法符号，从不触及语义，就像房间里那个人永远没有“理解”中文。他严格区分“弱 AI”（计算机是有用的工具）与“强 AI”（编程适当的计算机就是心灵）。批评者反击：也许单独的人不懂，但“整个房间系统”懂（系统回应）；也许未来机器真能造出理解。大语言模型时代，这场攻防被重新翻出来：模型写出流畅的情书，它“理解”爱情吗？',
          q: '你学外语背句型时，和房间里那个人有多大区别？AI 呢？',
          book: '塞尔《心灵、大脑与程序》（1980）', bookSearch: '中文房间 塞尔' },
        { topic: '奥卡姆剃刀：如无必要，勿增实体', school: '中世纪 · 奥卡姆的威廉（约1287—1347）', kw: '奥卡姆剃刀',
          text: '奥卡姆的威廉是英格兰萨里郡奥卡姆村的方济各会修士，因批判教皇被传唤到阿维尼翁，后来投奔巴伐利亚皇帝路易四世，据说留下名言：“皇帝用剑保护我，我用笔保护皇帝。”那条著名原则——“如无必要，勿增实体”（Pluralitas non est ponenda sine necessitate）——原本针对的是中世纪唯名论与实在论之争：实在论者相信每个抽象名词背后都有一个真实存在的“共相”，奥卡姆说：不必，少些假设。“奥卡姆剃刀”这个叫法其实迟至 1852 年才由后人提出。今天它是科学方法论的隐形守则：地心说靠层层“本轮”修补，被更简洁的日心说取代；统计学用 AIC/BIC 惩罚复杂模型；医生诊断优先考虑常见病——凡解释力相同，取假设最少的那个。',
          q: '你解释一件事时，有没有为它添加过其实用不上的“隐藏假设”？',
          book: '奥卡姆的威廉《箴言书注》', bookSearch: '奥卡姆剃刀' },
        { topic: '芝诺悖论：阿基里斯追不上乌龟', school: '古希腊 · 芝诺（约前490—前430）', kw: '芝诺悖论',
          text: '芝诺是爱利亚人，老师巴门尼德主张“存在是一，不动不变”，天下人都笑他。芝诺不正面辩护，而是发明了归谬法：假如你们坚持“多”与“运动”，就会推出更荒谬的结论——阿基里斯追不上乌龟：追到起跑点时乌龟已前移，追到新位置它又移了一点，无穷逼近却“永远”差一截；飞矢不动：任一瞬间，箭占据与自身等长的空间，即静止，而时间由瞬间组成，所以飞行是幻觉。传说他因谋反被僭主拿住，受审时咬下对方耳朵，就刑而死。两千多年后数学给出回应：1/2 + 1/4 + 1/8 + … 收敛于 1，无穷多步可以在有限时间内走完——芝诺错把“无穷多步”当成了“无穷长时间”。但追问没有结束：数学解的是描述，物理上的时间与空间真的是连续的吗？黑格尔则从中看到了辩证法的萌芽。',
          q: '悖论的前提哪里错了？还是说，错的是我们对“无穷”的直觉？',
          book: '亚里士多德《物理学》第六卷', bookSearch: '物理学 亚里士多德' },
        { topic: '维特根斯坦：词的意义是它的用法', school: '分析哲学 · 维特根斯坦（1889—1951）', kw: '维特根斯坦 语言游戏',
          text: '维特根斯坦的一生比他的书更像哲学：欧洲钢铁大亨家的天才（三个哥哥相继自杀），放弃巨额遗产，跑到剑桥跟罗素学哲学，一战扛起炮管上前线，在战壕与俘虏营里写完《逻辑哲学论》——正文薄到只有七个主命题，最后一句是“凡不可说的，必须保持沉默”。然后他宣布哲学问题已全部解决，跑去奥地利乡村当小学教师，还给姐姐设计了一栋极简主义住宅。十年后他推翻了自己：《哲学研究》（1953 年身后出版）承认前一本书是错的。语言不是世界的镜子，而是无数“语言游戏”的集合；词的意义不在指称对象，而在用法；“游戏”没有共同本质，只有“家族相似”的交叉重叠。哲学问题的根源是把词语从用法中拔了出来——哲学不是理论，而是治疗：“给苍蝇指出飞出捕蝇瓶的路。”',
          q: '“爱”“自由”“公平”这些词，你在不同场合的用法真的同一个意思吗？',
          book: '维特根斯坦《哲学研究》', bookSearch: '哲学研究 维特根斯坦' },
        { topic: '罗素悖论：理发师刮不刮自己的脸', school: '逻辑学 · 罗素（1901）', kw: '罗素悖论',
          text: '1901 年，罗素正在研究弗雷格的宏伟工程——把全部数学还原为逻辑。弗雷格已经用“集合”搭好了地基，罗素却发现了一颗雷：定义 R 为“所有不包含自身的集合”的集合，那么 R 包含自己吗？包含，则按定义它不该包含自己；不包含，则按定义它必须包含自己。他写信告诉弗雷格，弗雷格回信承认这是对他毕生事业的沉重打击——大厦的地基塌了。后人给它编了通俗版：理发师宣布只给“所有不给自己刮脸的人”刮脸，那他自己的脸怎么办？这场危机直接催生了罗素的类型论与公理化集合论（ZFC），把“自我包含”逐出合法集合；二十年后哥德尔的不完备定理再度证明：足够强的数学系统无法既完备又自洽。数学的地基，至今带着这道伤疤工作。',
          q: '“给所有不给自己刮脸的人刮脸”的理发师，该怎么处理自己的胡子？',
          book: '怀特海 & 罗素《数学原理》', bookSearch: '数学原理 罗素' },
        { topic: '自由意志与决定论', school: '形而上学 · 经典争论', kw: '自由意志 决定论',
          text: '拉普拉斯说：只要知道宇宙中每个粒子的位置和动量，就能推算出全部未来——如果这是真的，你的每个“选择”不过是被之前的状态推着走。面对决定论，哲学给出三条出路：强硬决定论者说自由是幻觉；自由意志论者寻找例外（量子随机性够吗？随机可不等于是你决定的）；主流站在相容论一边——休谟早就说过：自由不是“没有原因”，而是“按自己的意愿行动、且没有外部强迫”，囚犯不自由，散步的你自由，这和决定论毫无冲突。1983 年 Libet 的实验火上浇油：脑电的“准备电位”比人报告的“决定时刻”早了约 350 毫秒——但对实验设计的批评也接踵而至（“准备电位”未必等于决定本身）。更深的问题在道德：如果一切注定，惩罚还是正义吗？斯特劳森在《自由与怨恨》里回答：怨恨与感激是人性的底层反应，绕开它们谈责任是空谈。',
          q: '你觉得“自由”最核心的定义是哪个：无原因，还是无强迫？',
          book: '休谟《人类理解研究》第八节', bookSearch: '自由意志 哲学' },
        { topic: '罗尔斯：无知之幕后的正义', school: '政治哲学 · 罗尔斯（1971）', kw: '无知之幕 罗尔斯',
          text: '1971 年，《正义论》出版——二十五年磨一剑，让几乎无人问津的政治哲学起死回生。罗尔斯的设计：想象你被扔进“原初状态”，蒙着“无知之幕”——即将出生，却不知道自己会是谁：性别、天赋、家境、时代一律未知，只保留关于社会与心理学的基本常识。在这种极端公平的谈判桌上，人会同意什么？他论证出两个原则：第一，每个人都拥有最大的平等基本自由（言论、信仰、人身），这套自由不可拿去换经济利益；第二，社会经济的不平等只有在“机会对所有人开放”且“最有利于最弱势群体”（差别原则）时才被允许。无知之幕后的理性人会选择“最大化最小值”的保险：宁可规则保守，也不让最差的处境糟糕透顶。批评接踵而至：诺齐克说差别原则侵犯个人产权，桑德尔说“被剥光身份的自我”根本不存在——但“罗尔斯点”（社会可容忍的最大不平等线）至今写在政策讨论里。',
          q: '抹掉你现在的身份重抽一次人生，你还愿意接受今天这个社会的规则吗？',
          book: '罗尔斯《正义论》', bookSearch: '正义论 罗尔斯' },
        { topic: '庄周梦蝶', school: '中国 · 庄子（约前369—前286）', kw: '庄周梦蝶',
          text: '《齐物论》的结尾只有一百来字，却是中文世界最深的一个梦：“昔者庄周梦为胡蝶，栩栩然胡蝶也，自喻适志与，不知周也。俄然觉，则蘧蘧然周也。不知周之梦为胡蝶与，胡蝶之梦为周与？”庄周梦蝶不稀奇，稀奇的是他把问题反着问了一遍——凭什么说这一边才是“醒”？庄子不给答案，只给四个字：“此之谓物化”：万物在流转中互相转化，梦与醒、物与我，本没有绝对的界限。对比笛卡尔：同样的梦境怀疑，笛卡尔用“我思”把它当敌人驱除，庄子却安然与之共处，甚至借此消解是非与彼此的执念。蝴蝶的意象从此飞进中国文化的基因——梁祝在化蝶中团圆，李商隐写下“庄生晓梦迷蝴蝶”。处理“真实”这个问题，中国人有自己的温柔。',
          q: '如果分不清梦与醒，你会因此改变今天做事的方式吗？',
          book: '《庄子·齐物论》', bookSearch: '庄子 齐物论' },
        { topic: '白马非马', school: '中国名家 · 公孙龙（约前320—前250）', kw: '白马非马',
          text: '战国末年的赵国辩士公孙龙牵着一匹白马过关，守关者说马不得过，他回了一句“白马非马”——这则辩论记载在《公孙龙子·白马论》里。论证是这样的：“马”这个字只命名形体，“白马”却命名了形体加颜色，内涵不同、外延也不同（白马只是马的真子集），所以说“白马非马”——如果这里的“非”读作“不等于”，完全成立；若读作“不属于”，就是诡辩。守关者没跟上这个层次差，只好放行收费。公孙龙还留下了“离坚白”（石头的坚硬与白色能否分开感知）等论题，名家一时与儒墨并显。这场名实之辩是中国逻辑学的高峰，秦汉之后基本失传——直到近代学者重新发现，才惊叹两千多年前有人把语言哲学玩到了这个深度。',
          q: '“白马非马”在什么语境下是对的？你生活里有哪些同名不同实的争论？',
          book: '《公孙龙子·白马论》', bookSearch: '公孙龙子 白马论' },
        { topic: '王阳明：你未看此花时', school: '中国 · 王阳明（1472—1529）', kw: '王阳明 心学',
          text: '王阳明年轻时笃信朱熹的“格物穷理”，于是对着庭院里的竹子格了七天七夜，格到生病，一无所获——“圣贤之道”哪是盯着外物能盯出来的？1508 年，他因得罪宦官刘瑾被廷杖后贬到贵州龙场驿，在瘴气与蛮荒之间，一夜顿悟：“圣人之道，吾性自足，向之求理于事物者误也。”道理不在竹子里，在我心里。由此他提出“心即理”与“知行合一”：真知必然已经体现在行动里——嘴上说知道孝悌却做不到，那不是知道，只是“未曾知”。《传习录》里师生问答全是这种逼问。还有那段著名的花之问答：“你未看此花时，此花与汝心同归于寂；你来看此花时，则此花颜色一时明白起来。”文的极致之外他还有武的极致：几乎空手平定了宁王朱宸濠的叛乱。他的心学东渡日本，深刻影响了明治维新一代人。',
          q: '有没有一件你“完全知道该做”却一直没做的事——按知行合一，那算知道吗？',
          book: '王阳明《传习录》', bookSearch: '传习录 王阳明' },
        { topic: '墨子：兼相爱，交相利', school: '中国 · 墨子（约前468—前376）', kw: '墨子 兼爱',
          text: '墨子出身工匠，精通守城器械，据说与公输班用模型演过一场攻防战，硬生生劝退了楚国攻打宋国。他反对儒家的“爱有差等”（先亲后疏、由近及远），认为天下大乱正起于“人各爱其人”——《墨子·兼爱上》说，臣子不忠、儿子不孝、盗贼横行，都是因为人人只爱自己。药方是“兼爱”：视人之国若视其国，视人之父若视其父。他不空谈道德，配了三个论证：功利论证（兼相爱则交相利，攻战亏本）、天志论证（天欲人相爱相利）、类比论证。孟子读到大怒，骂“墨氏兼爱，是无父也”——是禽兽。但墨家真的组织起来了：钜子制度纪律严明，赴火蹈刃；后期墨家在《墨经》里搞出了小孔成像、杠杆力学和堪比西方逻辑学的“名辩”体系——那是华夏文明离“科学”最近的一次，也是最令人唏嘘的一次中断。',
          q: '爱真的需要分远近亲疏吗？不分的话，能量从哪里来？',
          book: '《墨子·兼爱》', bookSearch: '墨子 兼爱' },
        { topic: '赫拉克利特：人不能两次踏进同一条河流', school: '古希腊 · 赫拉克利特（约前535—前475）', kw: '赫拉克利特 流变',
          text: '这位绰号“晦涩者”的以弗所贵族放弃王位隐居神庙，写下《论自然》残篇一百三十余条，句句像谜语：“人不能两次踏进同一条河流”——因为河水常新，第二次踏进的已是新的河流。世界在他眼里是一团永恒的活火，按分寸燃烧、按分寸熄灭；对立面的斗争才是一切：他说“战争是万物之父”，没有疾病就无所谓健康，没有疲倦就无所谓休息。而贯穿流变的，是他称为“逻各斯”（logos）的隐藏法则——万物都依据这条理性的道运行。赫拉克利特与巴门尼德构成了希腊哲学的两极：一切都变 vs 一切都不变，此后两千多年的形而上学，几乎都在这两极之间摇摆。',
          q: '十年间你的细胞和观念都换了一遍——今天的你和十年前的你，是“同一个”你吗？',
          book: '《赫拉克利特著作残篇》', bookSearch: '赫拉克利特 残篇' },
        { topic: '普罗塔哥拉：人是万物的尺度', school: '古希腊智者 · 普罗塔哥拉（约前490—前420）', kw: '普罗塔哥拉 人是万物的尺度',
          text: '苏格拉底的时代还有一群靠教人说话吃饭的人——智者（Sophists），收费教修辞与论辩，其中最有名的是普罗塔哥拉。他在《真理论》开篇扔下一句震撼希腊的话：“人是万物的尺度，是存在的事物存在的尺度，也是不存在的事物不存在的尺度。”风对同一阵风，有人觉得冷有人觉得凉快——那么风“本身”是什么，根本没有答案，只有各自的感受。这是一种彻底的相对主义：真理因人因时因地而异。柏拉图毕生都在与之搏斗，因为他担心这句话会瓦解一切客观的善恶标准。但换个角度看，它也是人文主义的第一次抬头——从此哲学的目光从星空落回了人自身。',
          q: '如果每个人都自成尺度，公共的“对错”还有可能吗？',
          book: '柏拉图《泰阿泰德篇》', bookSearch: '泰阿泰德篇 柏拉图' },
        { topic: '第欧根尼：请别挡住我的阳光', school: '古希腊犬儒学派 · 第欧根尼（约前412—前323）', kw: '第欧根尼 犬儒',
          text: '第欧根尼住在雅典市场的一只大陶缸里，白天提着灯“寻找真正的人”，吃饭喝水像狗一样在街头解决——“犬儒”（Cynic）这个绰号就是别人骂他“像狗”，他索性认领了。传说亚历山大大帝慕名来访，站在缸前问他想要什么赏赐，他只回了一句：“请别挡住我的阳光。”亚历山大感叹：“如果我不是亚历山大，我愿做第欧根尼。”他的哲学只有一句话：文明的名义、货币、礼节、虚荣都是枷锁，人应该按自然本性生活，像狗一样坦荡。以抛弃一切换取绝对的自由——这份彻底，让“犬儒”从一个嘲讽变成了一个学派的名字。',
          q: '如果削减所有身外之物能换来内心的绝对自由，你愿意削减到什么程度？',
          book: '第欧根尼·拉尔修《名哲言行录》', bookSearch: '名哲言行录 第欧根尼' },
        { topic: '奥古斯丁：时间究竟是什么', school: '中世纪 · 奥古斯丁（354—430）', kw: '奥古斯丁 忏悔录',
          text: '《忏悔录》第十一卷里，奥古斯丁写下了哲学史上最著名的时间之问：“时间究竟是什么？没有人问我，我倒清楚；有人问我，我想说明，便茫然不解了。”他的推理：过去已不存在，未来尚未来到，现在若不流逝又会变成永恒——可我们分明每天都在谈论“时间长短”。他的答案惊世骇俗：时间只存在于心灵之中，是“心灵的伸展”——记忆（过去的现在）、注意（现在的现在）、期望（未来的现在）。这段对时间的内省分析，比物理学的相对论早了一千五百年，也直接启发了胡塞尔的时间意识现象学。写下这段话的人，同时是把希腊哲学带进基督教的第一人。',
          q: '不看钟表，你凭什么感觉到“时间过去了”？那种感觉藏在身体的哪个部位？',
          book: '奥古斯丁《忏悔录》第十一卷', bookSearch: '忏悔录 奥古斯丁' },
        { topic: '马基雅维利：政治与道德的分家', school: '文艺复兴 · 马基雅维利（1469—1527）', kw: '马基雅维利 君主论',
          text: '马基雅维利曾是佛罗伦萨的外交官，美第奇家族复辟后被罢官下狱，乡下种地时写出了《君主论》。他做了一件当时惊世骇俗的事：不谈“君主应当如何”，只谈“君主实际上如何保住权力”。他的结论冷酷而清晰：君主要学“效果真相”，必要时必须懂得“能够不善良”；若善良与安全不可兼得，被人畏惧比被人爱戴更安全——因为爱基于你说了算的人心，畏惧基于你说了算的惩罚；理想的君主要兼有狮子的凶猛与狐狸的狡猾。“马基雅维利主义”从此成了权术的同义污名，但政治现实主义的大门是他推开的：政治自有一套逻辑，不再从属于神学和道德说教。',
          q: '如果结果能救更多人，手段上的“不干净”可以被原谅吗？界限在哪里？',
          book: '马基雅维利《君主论》', bookSearch: '君主论 马基雅维利' },
        { topic: '霍布斯：一切人对一切人的战争', school: '英国经验论 · 霍布斯（1588—1679）', kw: '霍布斯 利维坦',
          text: '霍布斯亲历了英国内战的血腥，在《利维坦》（1651）里设想了一种“自然状态”：没有国家和法律时，人人都有伤害他人的能力与理由，猜疑与恐惧让先下手为强成为理性选择——那将是“一切人对一切人的战争”，人的生活“孤独、贫困、卑污、残忍而短寿”。逃出这场噩梦的唯一办法是契约：所有人把权利交给一个绝对主权者——“利维坦”，用无法反抗的强力换来和平。他是把国家当成一台“人造机器”来解剖的第一人，也是现代社会契约论的开端。最大的争议同样来自他：主权者的权力要不要被限制？霍布斯的答案是不——因为限制会让利维坦解体，战争重临。',
          q: '如果明天所有法律与警察一夜消失，你预测人性会把世界变成什么样？',
          book: '霍布斯《利维坦》', bookSearch: '利维坦 霍布斯' },
        { topic: '卢梭：人生而自由，却无往不在枷锁之中', school: '法国启蒙 · 卢梭（1712—1778）', kw: '卢梭 社会契约',
          text: '《社会契约论》（1762）的第一句话就是一枚炸弹：“人是生而自由的，却无往不在枷锁之中。自以为是其他一切的主人的人，反而比其他一切更是奴隶。”卢梭与霍布斯针锋相对：自然状态里的人并非邪恶的野兽，而是拥有怜悯心的“高贵的野蛮人”；是私有制和不平等把人变成了这样。出路不是把权利交给专制君主，而是每个人把自己交给“公意”——全体公民共同制定的法，人人既是臣民又是主权者。这本书后来成了法国大革命的圣经，“回到自然”也成了他一生的标签。至于他把自己的五个孩子全部送进育婴堂这件事——卢梭用一部《忏悔录》坦白了它，也辩解了一生。',
          q: '你身上有哪些“枷锁”是自己心甘情愿戴上的？',
          book: '卢梭《社会契约论》', bookSearch: '社会契约论 卢梭' },
        { topic: '叔本华：人生在痛苦与无聊之间摆动', school: '德国 · 叔本华（1788—1860）', kw: '叔本华 悲观主义',
          text: '叔本华在《作为意志和表象的世界》（1818）里宣布：世界的内核不是理性，而是盲目冲动的“生命意志”——我们以为自己在上进，其实是意志在推着我们欲求。而欲求的本质是匮乏：得不到，是痛苦；得到了，快感转瞬即逝，随之而来的是无聊，然后新的欲求又开始——人生就像钟摆，在痛苦与无聊之间永不停歇。解药有三档：审美静观（在艺术里暂时跳出欲求，音乐尤其如此，因为它是意志本身的直接写照）、对他人苦难的同情，以及最彻底的——否定意志本身。这本书初印时几乎无人问津，晚年却突然爆红。尼采、瓦格纳、托尔斯泰、弗洛伊德，都承认欠了他一笔债。',
          q: '回想你最近一次“终于得到”的经历——满足感持续了多久？',
          book: '叔本华《作为意志和表象的世界》', bookSearch: '作为意志和表象的世界 叔本华' },
        { topic: '密尔：伤害原则', school: '英国 · 密尔（1806—1873）', kw: '密尔 论自由',
          text: '《论自由》（1859）要回答一个今天依然尖锐的问题：多数人凭什么管少数人怎么生活？密尔的答案被称为“伤害原则”：对文明社会的任何成员，能违背其意志而正当地干涉他的唯一目的，是防止对他人造成伤害——仅仅是“为了他好”或“多数人看不惯”，都不构成理由。赌博、饮酒这些自伤行为不该被法律禁止；而对不同意见的压制更是双输：被压的意见可能是对的，即使它错了，真理也会在交锋中更鲜明。这一原则成了自由社会的基石，但边界争议从未停止：色情、毒品、危险运动、“冒犯他人”算伤害吗？密尔给你划了起点，剩下的每一步都要自己判断。',
          q: '你反对过的某种生活方式，究竟“伤害”了谁，还是只是让你不舒服？',
          book: '密尔《论自由》', bookSearch: '论自由 密尔' },
        { topic: '海德格尔：向死而生', school: '德国 · 海德格尔（1889—1976）', kw: '海德格尔 向死而生',
          text: '《存在与时间》（1927）难读到出名，但其中一个概念照亮了无数人：向死而生（Sein zum Tode）。海德格尔把人称为“此在”，并指出我们平时大多活在“常人”（das Man）的模式里：别人怎么想，我就怎么想；别人怎么活，我就怎么活。而死亡是唯一“无人能替代、必须由你自己承担”的可能性——只要直面它，你就会从随波逐流中被拽出来，被迫回答“我到底想怎么活”。这不是教人悲观，而是把死亡当作唤醒本真生活的闹钟。这个思想塑造了整个存在主义（萨特直接受其影响），也常被引用于临终关怀与心理治疗。海德格尔本人的纳粹污点，则成为“伟大思想与失败人格能否分开”的永久考题。',
          q: '如果明确知道自己的死期，你现在排在前三的事会发生什么变化？',
